    const sens=SIM.sensLevers.filter(k=>definitions[k]).map(k=>{const [lab,down,up]=definitions[k];return [lab,simulateWith(down).at(-1).solde-baseFinal,simulateWith(up).at(-1).solde-baseFinal];});
    if(sens.length){tracer('v2-r2-sens',[{y:sens.map(r=>r[0]),x:sens.map(r=>r[1]),name:`Défavorable (${SIM.sensPct} %)`,type:'bar',orientation:'h',marker:{color:C.rouge}},{y:sens.map(r=>r[0]),x:sens.map(r=>r[2]),name:`Favorable (${SIM.sensPct} %)`,type:'bar',orientation:'h',marker:{color:C.sarcelle}}],`Sensibilité du solde final — choc ±${SIM.sensPct} %`,370,{barmode:'relative',hovermode:'closest',margin:{l:190,r:30,t:55,b:45}});}
    else document.getElementById('v2-r2-sens').innerHTML='<p class="note" style="padding:20px">Sélectionne au moins un levier opérationnel dans les paramètres.</p>';
    document.getElementById('v2-r2-sens-table').innerHTML=sens.length?tableau(['Levier','Impact défavorable','Impact favorable'],sens.map(r=>[r[0],v2money(r[1]),v2money(r[2])]),{num:[1,2]}):'<p class="note">Aucun levier sélectionné.</p>';
    const rf=D.r2.referentiels.slice(0,Math.min(D.r2.referentiels.length,r2.length));
    tracer('v2-r2-ref',[{x:rf.map(r=>r.etiquette),y:rf.map(r=>r.solde_reel),name:'Réel',mode:'lines+markers',type:'scatter',connectgaps:false,line:{color:C.sarcelle,width:2.3}},{x:rf.map(r=>r.etiquette),y:r2.slice(0,rf.length).map(r=>r.solde),name:'Forecast',mode:'lines+markers',type:'scatter',line:{color:C.laiton,width:2.3}},{x:rf.map(r=>r.etiquette),y:rf.map(r=>r.solde_budgete),name:'Budget',mode:'lines',type:'scatter',line:{color:C.bleu,width:2,dash:'dot'}},{x:rf.map(r=>r.etiquette),y:rf.map(()=>SIM.seuil),name:'Seuil',mode:'lines',type:'scatter',line:{color:C.rouge,dash:'dash'}}],'Réel / forecast / budget',370);

    // R3
    const weeks=Array.from({length:r3.p50.length},(_,i)=>i),probWeek=weeks.map((_,j)=>r3.paths.filter(path=>Number(path[j])<SIM.seuil).length/r3.paths.length);
    const real=D.r1.semaines.filter(x=>x.statut==='Réel'),histNet=real.map(x=>Number(x.net));
    const finalStats=[['Moyenne',avg(r3.finals),avg(r3.troughs)],['Médiane',percent(r3.finals,50),percent(r3.troughs,50)],['Écart-type',std(r3.finals),std(r3.troughs)],['P5',percent(r3.finals,5),percent(r3.troughs,5)],['P10',percent(r3.finals,10),percent(r3.troughs,10)],['P90',percent(r3.finals,90),percent(r3.troughs,90)],['P95',percent(r3.finals,95),percent(r3.troughs,95)],['Minimum',Math.min(...r3.finals),Math.min(...r3.troughs)],['Maximum',Math.max(...r3.finals),Math.max(...r3.troughs)]];
    document.getElementById('p-r3').innerHTML=`<p class="cpa-eyebrow">Short-term liquidity stress</p><h2>R3 · Bootstrap par blocs — distribution et risque court terme</h2>${panneauR3()}
      <p class="note">${r3.stats.nb_essais} essais · blocs de ${SIM.blocBS} semaine(s). Le rapport montre maintenant la trajectoire, la distribution des soldes finaux, la distribution des creux et la distribution empirique des flux hebdomadaires observés.</p>
      ${bandeKpi([['Solde final médian',v2money(r3.stats.mediane)],['P10',v2money(r3.stats.p10),'alerte'],['Creux P5',v2money(r3.stats.creux_p5),r3.stats.creux_p5<SIM.seuil?'alerte':'ok'],['Prob. sous le seuil',v2pct(r3.stats.prob_sous_seuil),r3.stats.prob_sous_seuil>.05?'alerte':'ok'],['Prob. découvert',v2pct(r3.stats.prob_decouvert),r3.stats.prob_decouvert>0?'alerte':'ok'],['Périodes sous seuil / essai',Number(r3.stats.periodes_sous_seuil_moy).toFixed(2).replace('.',',')]])}
      ${graphe('v2-r3-traj')}<div class="duo">${graphe('v2-r3-final')}${graphe('v2-r3-trough')}</div><div class="duo">${graphe('v2-r3-prob')}${graphe('v2-r3-history')}</div>
      <h3>Statistiques descriptives des distributions</h3>${tableau(['Statistique','Solde final','Creux de trajectoire'],finalStats.map(r=>[r[0],v2money(r[1]),v2money(r[2])]),{num:[1,2]})}`;
    tracer('v2-r3-traj',[{x:weeks,y:r3.p90,mode:'lines',type:'scatter',line:{width:0},showlegend:false},{x:weeks,y:r3.p10,name:'P10 – P90',mode:'lines',type:'scatter',fill:'tonexty',fillcolor:'rgba(177,120,45,.15)',line:{width:0}},{x:weeks,y:r3.p50,name:'Médiane',mode:'lines',type:'scatter',line:{color:C.laiton,width:2.6}},{x:weeks,y:weeks.map(()=>SIM.seuil),name:'Seuil',mode:'lines',type:'scatter',line:{color:C.rouge,dash:'dash'}}],'Trajectoire simulée — P10 / P50 / P90',390,{xaxis:{title:'Semaine'}});
    tracer('v2-r3-final',[{x:r3.finals,type:'histogram',nbinsx:28,name:'Solde final',marker:{color:C.sarcelle}}],'Distribution des soldes finaux',360,{hovermode:'closest',shapes:[vline(SIM.seuil)]});
    tracer('v2-r3-trough',[{x:r3.troughs,type:'histogram',nbinsx:28,name:'Creux',marker:{color:C.orange}}],'Distribution des creux de trésorerie',360,{hovermode:'closest',shapes:[vline(SIM.seuil),vline(0,C.texte,'dot')]});
    tracer('v2-r3-prob',[{x:weeks.slice(1),y:probWeek.slice(1),name:'Probabilité sous le seuil',type:'bar',marker:{color:probWeek.slice(1).map(q=>q>.25?C.rouge:q>.05?C.orange:C.sarcelle)}}],'Probabilité de rupture — semaine par semaine',350,{yaxis:{tickformat:'.0%',range:[0,Math.max(.1,...probWeek)*1.15]},hovermode:'closest'});
    tracer('v2-r3-history',[{x:histNet,type:'histogram',nbinsx:8,name:'Flux net observé',marker:{color:C.bleu}}],'Distribution empirique — flux nets hebdomadaires réels',350,{hovermode:'closest',shapes:[vline(0,C.texte,'dot')]});

    // R7
    const months=Array.from({length:mc.ptiles[3].length},(_,i)=>i),probBelow=months.map((_,j)=>mc.paths.filter(path=>Number(path[j])<SIM.seuil).length/mc.paths.length),probOD=months.map((_,j)=>mc.paths.filter(path=>Number(path[j])<0).length/mc.paths.length);
    const firsts=mc.paths.map(path=>path.findIndex((v,j)=>j>0&&Number(v)<SIM.seuil)).filter(i=>i>0);const medFirst=firsts.length?Math.round(percent(firsts,50)):null;
    const periodsBelow=mc.paths.map(path=>path.slice(1).filter(v=>Number(v)<SIM.seuil).length);const avgBelow=avg(periodsBelow);
    const prolonged=mc.paths.filter(path=>{let run=0;for(const v of path.slice(1)){run=Number(v)<SIM.seuil?run+1:0;if(run>=2)return true;}return false;}).length/mc.paths.length;
    document.getElementById('p-r7').innerHTML=`<p class="cpa-eyebrow">Liquidity risk</p><h2>R7 · Risque de liquidité — Monte-Carlo 12 mois</h2>${panneauR7()}

      ${bandeKpi([['Solde final médian',v2money(mc.stats.mediane)],['P10 final',v2money(mc.stats.p10),'alerte'],['Creux P5',v2money(mc.stats.creux_p5),mc.stats.creux_p5<SIM.seuil?'alerte':'ok'],['Prob. sous le seuil',v2pct(mc.stats.prob_sous_seuil),mc.stats.prob_sous_seuil>.05?'alerte':'ok'],['Prob. découvert',v2pct(mc.stats.prob_decouvert),mc.stats.prob_decouvert>0?'alerte':'ok'],['1re rupture médiane',medFirst===null?'Aucune':`Mois ${medFirst}`]])}
      ${graphe('v2-r7-fan')}${graphe('v2-r7-spaghetti')}<div class="duo">${graphe('v2-r7-prob')}${graphe('v2-r7-trough')}</div>
      <h3>Indicateurs complémentaires</h3>${tableau(['Indicateur','Résultat','Lecture'],[['Mois sous le seuil — moyenne',avgBelow.toFixed(2).replace('.',','),'Nombre moyen de mois de tension par simulation'],['Probabilité de tension prolongée (≥2 mois)',v2pct(prolonged),'Mesure les tensions qui persistent au-delà d’un seul mois'],['Probabilité de finir sous le solde de départ',v2pct(mc.stats.prob_sous_depart),'Mesure la probabilité de destruction nette de cash sur l’horizon'],['Scénarios affichés',String(Math.min(SIM.nPaths,mc.paths.length)),'Paramètre de lecture du spaghetti chart']])}`;
    tracer('v2-r7-fan',[{x:months,y:mc.ptiles[6],mode:'lines',type:'scatter',line:{width:0},showlegend:false,hoverinfo:'skip'},{x:months,y:mc.ptiles[0],name:'P5 – P95',mode:'lines',type:'scatter',fill:'tonexty',fillcolor:'rgba(177,120,45,.10)',line:{width:0}},{x:months,y:mc.ptiles[4],mode:'lines',type:'scatter',line:{width:0},showlegend:false,hoverinfo:'skip'},{x:months,y:mc.ptiles[2],name:'P25 – P75',mode:'lines',type:'scatter',fill:'tonexty',fillcolor:'rgba(177,120,45,.22)',line:{width:0}},{x:months,y:mc.ptiles[3],name:'Médiane',mode:'lines',type:'scatter',line:{color:C.laiton,width:2.7}},{x:months,y:months.map(()=>SIM.seuil),name:'Seuil',mode:'lines',type:'scatter',line:{color:C.rouge,dash:'dash'}}],'Éventail du solde de trésorerie — 12 mois',410,{xaxis:{title:'Mois'}});
    const nShow=Math.min(Math.max(5,SIM.nPaths),mc.paths.length),paths=mc.paths.slice(0,nShow).map((t,i)=>({x:t.map((_,k)=>k),y:t,mode:'lines',type:'scatter',line:{width:1.05},opacity:.62,showlegend:false,name:'Scénario '+(i+1)}));paths.push({x:months,y:months.map(()=>SIM.seuil),name:'Seuil',mode:'lines',type:'scatter',line:{color:C.rouge,width:2,dash:'dash'}});

    tracer('v2-r7-trough',[{x:mc.troughs,type:'histogram',nbinsx:30,name:'Creux simulé',marker:{color:C.laiton}}],'Distribution du minimum de trésorerie par scénario',360,{hovermode:'closest',shapes:[vline(SIM.seuil),vline(0,C.texte,'dot')]});

    // R1 : scénario actif + seuil dynamique
    document.querySelectorAll('#sim-r1-badge').forEach(x=>x.remove());const r1=document.getElementById('p-r1');if(r1){r1.querySelector('.note')?.insertAdjacentHTML('afterend',`<div id="sim-r1-badge" class="cpa-callout"><strong>Scénario R2 actif</strong><p>${SIM.scenario} · solde final ${v2money(r2.at(-1).solde)} · creux ${v2money(activeMin)} · ${r2.filter(x=>x.solde<SIM.seuil).length} semaine(s) sous le seuil.</p></div>`);const el=document.getElementById('v2-r1-cycle');if(el&&el.data){const idx=el.data.length-1;Plotly.restyle('v2-r1-cycle',{y:[el.data[idx].x.map(()=>SIM.seuil)]},[idx]).catch(()=>{});}}
    initControls();wireControls();const state=document.getElementById('sim-state');if(state)state.textContent=`Mis à jour ${new Date().toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'})}`;
  };

<script id="r8-time-series-script">
(function(){
  // R8 · Analyse temporelle & qualité prévisionnelle — V5 / 48 mois + SARIMAX
  // Les graphiques sont rendus seulement lorsque l'onglet est visible.
  // Les séries détaillées proviennent des 48 mois du journal SQLite (2023–2024 synthétiques, 2025–2026 historique existant).

  const mean=a=>a.length?a.reduce((s,x)=>s+Number(x||0),0)/a.length:0;

  function linFit(y){

  }
  function decompose(y,cycleWin,seasonPeriod=12){
    y=finite(y);
    const p=Math.max(2,Math.min(Number(seasonPeriod)||12,Math.max(2,y.length)));
    const lf=linFit(y),trend=lf.pred;
    const detr=y.map((v,i)=>v-trend[i]);
    const sm=Array(p).fill(0),cnt=Array(p).fill(0);
    detr.forEach((v,i)=>{sm[i%p]+=v;cnt[i%p]++;});
    let sf=sm.map((s,i)=>cnt[i]?s/cnt[i]:0);
    const c=mean(sf); sf=sf.map(x=>x-c);
    const season=y.map((_,i)=>sf[i%p]);

  function acf(y,maxLag=12){

  function hwFit(train,h,alpha,beta,gamma,period=12){

  function bestHW(train,actual,period=12){

  function solveLinear(A,b){
    const n=b.length;if(!n)return null;
    const M=A.map((r,i)=>r.map(Number).concat([Number(b[i])]));
    for(let i=0;i<n;i++){
      let piv=i;for(let r=i+1;r<n;r++)if(Math.abs(M[r][i])>Math.abs(M[piv][i]))piv=r;
      if(Math.abs(M[piv][i])<1e-10)return null;
      [M[i],M[piv]]=[M[piv],M[i]];
      const d=M[i][i];for(let c=i;c<=n;c++)M[i][c]/=d;
      for(let r=0;r<n;r++)if(r!==i){const f=M[r][i];if(Math.abs(f)>1e-14)for(let c=i;c<=n;c++)M[r][c]-=f*M[i][c];}
    }
    return M.map(r=>r[n]);

  function olsRidge(X,y){
    if(!X.length||!X[0].length)return null;const k=X[0].length;
    const A=Array.from({length:k},()=>Array(k).fill(0)),b=Array(k).fill(0);
    for(let r=0;r<X.length;r++)for(let i=0;i<k;i++){

  function sarTransform(y,d,D,s){

  function sarInvert(pred,ops){

  const PY_ENGINE={available:null,last:null,error:''};
  async function pythonSarimax(seriesKey,horizon,holdout){

  function sarimaxForecast(y,h,par=sarParams()){
    y=finite(y);const p=Math.max(0,par.p|0),d=Math.max(0,par.d|0),q=Math.max(0,par.q|0),P=Math.max(0,par.P|0),D=Math.max(0,par.D|0),Q=Math.max(0,par.Q|0),s=Math.max(2,par.s|0),K=Math.max(0,par.fourier|0);
    const tr=sarTransform(y,d,D,s);if(!tr)return {valid:false,pred:[],warning:'Différenciation trop forte pour la longueur de série.'};
    const z=tr.z,n=z.length,maxLag=Math.max(p,q,P*s,Q*s,0);

    q('r8-h').addEventListener('input',e=>{S.horizon=Number(e.target.value);q('r8-hv').textContent=S.horizon+' mois';});q('r8-h').addEventListener('change',apply);
    q('r8-z').addEventListener('input',e=>{S.z=Number(e.target.value);q('r8-zv').textContent=S.z.toFixed(1)+' σ';});q('r8-z').addEventListener('change',apply);
    [['r8-alpha','hwAlpha','r8-av'],['r8-beta','hwBeta','r8-bv'],['r8-gamma','hwGamma','r8-gv']].forEach(([id,key,label])=>{const el=q(id);if(!el)return;el.addEventListener('input',e=>{S[key]=Number(e.target.value);q(label).textContent=S[key].toFixed(2);});el.addEventListener('change',apply);});
    const sarMap=[['r8-sarp','sarP'],['r8-sard','sarD'],['r8-sarq','sarQ'],['r8-sarP','sarSP'],['r8-sarD','sarSD'],['r8-sarQ','sarSQ'],['r8-sarfourier','sarFourier']];
    sarMap.forEach(([id,key])=>{const el=q(id);if(el)el.addEventListener('change',e=>{S[key]=Number(e.target.value);apply();});});
    if(q('r8-sartrend'))q('r8-sartrend').addEventListener('change',e=>{S.sarTrend=!!e.target.checked;apply();});
    q('r8-apply').addEventListener('click',apply);
  }
  function plot(id,series,title,height,extra){
    const el=document.getElementById(id); if(!el)return;
    const clean=(series||[]).map(s=>{
      const c={...s};
      if(Array.isArray(c.y)) c.y=c.y.map(v=>v==null?null:(Number.isFinite(Number(v))?Number(v):null));
      return c;
    });
    try{
      Plotly.purge(el);
      Plotly.newPlot(el,clean,mise(title,height,extra),CONFIG);
    }catch(err){
      el.innerHTML=`<div class="encart"><p>Le graphique n'a pas pu être rendu. ${String(err.message||err)}</p></div>`;
      console.error('R8 Plotly',id,err);
    }
  }
  async function render(){
    const def=CATALOG[S.serie]||CATALOG.Revenu, label=def.label;
    const y=finite(def.values),d=decompose(y,S.cycle,S.seasonPeriod),bench=benchmark(y);
    let pySar=null;
    if(S.modele==='SARIMAX'||S.modele==='Auto'){
      const st0=document.getElementById('r8-state');if(st0)st0.textContent='Calcul Python…';
      pySar=await pythonSarimax(S.serie,S.horizon,bench.hold);
      if(pySar&&pySar.ok){
        const b=pySar.backtest;
        bench.rows.push({id:'SARIMAX',mae:Number(b.mae),rmse:Number(b.rmse),bias:Number(b.bias),order:`(${S.sarP},${S.sarD},${S.sarQ})(${S.sarSP},${S.sarSD},${S.sarSQ})[${S.seasonPeriod}]`,engine:'Python statsmodels'});
      }else{
        const sar=sarimaxForecast(bench.train,bench.hold,sarParams());
        if(sar.valid)bench.rows.push({id:'SARIMAX',mae:mae(bench.actual,sar.pred),rmse:rmse(bench.actual,sar.pred),bias:bias(bench.actual,sar.pred),order:sar.order,engine:'Fallback navigateur'});
      }
      bench.rows.sort((a,b)=>a.mae-b.mae);bench.champion=bench.rows[0].id;
    }else{bench.rows.sort((a,b)=>a.mae-b.mae);bench.champion=bench.rows[0].id;}
    const fc=forecast(y,S.horizon,S.modele,bench,def.nonnegative,pySar);
    const avgY=mean(y),vol=avgY?sd(y)/Math.max(1,Math.abs(avgY)):0,trendPct=avgY?d.slope/Math.max(1,Math.abs(avgY)):0;
    const detr=y.map((v,i)=>v-d.trend[i]),afterSeason=y.map((v,i)=>v-d.trend[i]-d.season[i]);
    const seasonalStrength=variance(detr)?clamp01(1-variance(afterSeason)/variance(detr)):0;
    const cycleStrength=variance(afterSeason)?clamp01(1-variance(d.irregular)/variance(afterSeason)):0;
    const ac=acf(y,12),sig=sd(d.irregular)||1,active=y.filter(v=>Math.abs(v)>0.005).length;
    let anomalies=periods.map((p,i)=>({p,value:y[i],irr:d.irregular[i],z:d.irregular[i]/sig})).filter(r=>Math.abs(r.z)>=S.z);
    if(!anomalies.length) anomalies=periods.map((p,i)=>({p,value:y[i],irr:d.irregular[i],z:d.irregular[i]/sig})).sort((a,b)=>Math.abs(b.z)-Math.abs(a.z)).slice(0,5);
    const champion=bench.rows[0],selected=fc.name,selectedStats=bench.rows.find(r=>r.id===selected)||champion;
    const errSd=Math.max(selectedStats.rmse,selectedStats.mae*1.25,sd(d.irregular),1);
    const future=Array.from({length:S.horizon},(_,i)=>{const dt=new Date(periods.at(-1)+'-01T00:00:00');dt.setMonth(dt.getMonth()+i+1);return dt.toISOString().slice(0,7)});
    const spread=(z)=>fc.pred.map((v,i)=>z*errSd*Math.sqrt(1+(i+1)*.12));
    const s80=spread(1.282),s95=spread(1.96);
    const low=(pred,sp)=>pred.map((v,i)=>def.nonnegative?Math.max(0,v-sp[i]):v-sp[i]);
    const high=(pred,sp)=>pred.map((v,i)=>v+sp[i]);
    let p80lo=low(fc.pred,s80),p80hi=high(fc.pred,s80),p95lo=low(fc.pred,s95),p95hi=high(fc.pred,s95);
    if(fc.name==='SARIMAX'&&pySar&&pySar.ok){p80lo=finite(pySar.ci80_low);p80hi=finite(pySar.ci80_high);p95lo=finite(pySar.ci95_low);p95hi=finite(pySar.ci95_high);}
    const sparse=active<30;const sarOrd=`(${S.sarP},${S.sarD},${S.sarQ})(${S.sarSP},${S.sarSD},${S.sarSQ})[${S.seasonPeriod}]`;

    panel.innerHTML=`<p class="cpa-eyebrow">Time-series diagnostics & forecasting</p><h2>R8 · Analyse temporelle des flux de trésorerie</h2>${controls()}
      <div class="r8-formula"><div class="r8-eq"><span class="accent">Y<sub>t</sub></span> = T<sub>t</sub> + S<sub>t</sub> + C<sub>t</sub> + I<sub>t</sub></div><div class="r8-components"><div><strong>Tendance (T)</strong>Mouvement de fond à moyen/long terme.</div><div><strong>Saisonnalité (S)</strong>Motifs mensuels récurrents et planifiables.</div><div><strong>Cycle (C)</strong>Fluctuation lissée non strictement saisonnière.</div><div><strong>Irrégulier (I)</strong>Résidu, événement exceptionnel ou bruit.</div></div></div>
      ${bandeKpi([['Tendance mensuelle',fmtPct(trendPct),Math.abs(trendPct)>.05?'alerte':''],['Force saisonnière',fmtPct(seasonalStrength)],['Force cyclique',fmtPct(cycleStrength)],['Volatilité',fmtPct(vol),vol>.35?'alerte':''],['Champion backtest',bench.champion],['MAE modèle choisi',fmtMoney(selectedStats.mae)]])}
      <div class="r8-model-note"><strong>Série sélectionnée : ${label}.</strong> ${active} mois actifs sur ${periods.length}. Modèle utilisé : <strong>${selected}</strong> · saisonnalité ${S.seasonPeriod} mois · backtest ${bench.hold} mois. ${selected==='Holt-Winters additif'&&S.modele!=='Auto'?`α ${S.hwAlpha.toFixed(2)} · β ${S.hwBeta.toFixed(2)} · γ ${S.hwGamma.toFixed(2)}.`:''} ${selected==='SARIMAX'?`Ordre ${sarOrd} · X: ${S.sarTrend?'tendance':'sans tendance'}${S.sarFourier?` + Fourier K=${S.sarFourier}`:''} · moteur ${fc.engine}.`:''} ${fc.warning?`<span class='defavorable'>${fc.warning}</span>`:''} ${sparse?'Cette série est clairsemée : la saisonnalité et le backtest doivent être interprétés avec prudence.':'La couverture est suffisante pour un diagnostic renforcé sur 48 mois.'}</div>
      ${graphe('r8-main')}
      ${graphe('r8-season')}
      <div class="duo">${graphe('r8-irregular')}${graphe('r8-acf')}</div>
      <h3>Saisonnalité observée</h3><div class="duo">${graphe('r8-profile')}${graphe('r8-heat')}</div>
      <h3>Prévision & incertitude</h3>${graphe('r8-forecast')}
      <div class="duo"><div><h3>Champion / challenger</h3>${tableau(['Modèle','MAE','RMSE','Biais'],bench.rows.map(r=>[r.id,fmtMoney(r.mae),fmtMoney(r.rmse),fmtMoney(r.bias)]))}</div><div><h3>Anomalies / périodes à expliquer</h3>${tableau(['Période','Observé','Résidu','Z-score','Lecture'],anomalies.slice(0,8).map(r=>[r.p,fmtMoney(r.value),fmtMoney(r.irr),r.z.toFixed(2).replace('.',','),Math.abs(r.z)>=S.z?'À expliquer':'Plus fort résidu']))}</div></div>
      <div class="r8-mini-grid"><div class="r8-mini"><small>Nature de la série</small><strong>${def.nature}</strong></div><div class="r8-mini"><small>Modèle utilisé</small><strong>${selected}</strong></div><div class="r8-mini"><small>Biais — backtest</small><strong>${fmtMoney(bench.rows.find(r=>r.id===bench.champion)?.bias||0)}</strong></div><div class="r8-mini"><small>Historique</small><strong>${periods.length} mois</strong></div><div class="r8-mini"><small>SARIMAX courant</small><strong>${sarOrd}</strong></div>${selected==='SARIMAX'&&pySar&&pySar.ok?`<div class="r8-mini"><small>AIC / BIC Python</small><strong>${Number(pySar.diagnostics.aic).toFixed(1)} / ${Number(pySar.diagnostics.bic).toFixed(1)}</strong></div><div class="r8-mini"><small>Convergence SARIMAX</small><strong>${pySar.diagnostics.converged?'Oui':'À surveiller'}</strong></div>`:''}</div>
      <div class="r8-model-note"><strong>Lecture CPA.</strong> L'historique 2023–2024 a été ajouté sous forme synthétique pour porter la fenêtre à 48 mois; 2025–2026 demeure l'historique existant. Les dépenses sont présentées en valeur absolue. Le backtest mesure la performance statistique, pas la Forecast Accuracy de gestion. Lorsque le tableau est lancé avec <code>python tresorerie_dashboard.py</code>, SARIMAX est estimé par <strong>Python statsmodels</strong> (maximum de vraisemblance) et le backtest ainsi que les intervalles de confiance proviennent du moteur Python. L'ouverture directe du HTML conserve seulement un fallback navigateur.</div>`;

    plot('r8-main',[
      {x:periods,y,name:label+' — observé',mode:'lines+markers',type:'scatter',line:{color:C.orange,width:2.3}},
      {x:periods,y:d.trend,name:'Tendance',mode:'lines',type:'scatter',line:{color:C.texte,width:2.5}}
    ],`${label} — historique et tendance`,390);

    plot('r8-season',[
      {x:periods,y:d.season,name:'Saisonnalité',mode:'lines+markers',type:'scatter',line:{color:C.laiton,width:2.2}},
      {x:periods,y:periods.map(()=>0),name:'Zéro',mode:'lines',type:'scatter',line:{color:C.grille,dash:'dot'}}
    ],'Composante saisonnière (S)',320);

    plot('r8-irregular',[
      {x:periods,y:d.irregular,name:'Irrégulier',type:'bar',marker:{color:d.irregular.map(v=>Math.abs(v)>=S.z*sig?C.rouge:(v>=0?C.sarcelle:C.orange))}}
    ],'Composante irrégulière (I) — résidus',320,{hovermode:'closest'});

    plot('r8-acf',[
      {x:ac.map((_,i)=>i+1),y:ac,type:'bar',name:'ACF',marker:{color:ac.map(v=>Math.abs(v)>.35?C.laiton:C.sarcelle)}}
    ],'Autocorrélation — lags mensuels',320,{xaxis:{title:'Décalage (mois)',dtick:1,showgrid:false},yaxis:{range:[-1,1],gridcolor:C.grille}});

    const monthNames=['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sept','Oct','Nov','Déc'];
    const seasonLabels=S.seasonPeriod===12?monthNames:Array.from({length:S.seasonPeriod},(_,i)=>'P'+(i+1));
    const profile=avgY?d.sf.map(v=>v/Math.max(1,Math.abs(avgY))):d.sf.map(()=>0);
    plot('r8-profile',[
      {x:seasonLabels,y:profile,type:'bar',name:'Effet saisonnier',marker:{color:profile.map(v=>v>=0?C.sarcelle:C.rouge)},hovertemplate:'%{x}<br>%{y:.1%} vs tendance<extra></extra>'}
    ],`Profil saisonnier — période ${S.seasonPeriod} mois`,300,{yaxis:{tickformat:'.0%',gridcolor:C.grille},hovermode:'closest'});

    const years=[...new Set(periods.map(p=>p.slice(0,4)))];
    const z=years.map(yr=>{
      const vals=periods.map((p,i)=>p.startsWith(yr)?y[i]:null).filter(v=>v!==null),m=mean(vals);
      return Array.from({length:12},(_,mo)=>{
        const idx=periods.findIndex(p=>p===`${yr}-${String(mo+1).padStart(2,'0')}`);
        return idx>=0&&Math.abs(m)>1e-9?(y[idx]/m-1):0;
      });
    });
    plot('r8-heat',[{
      z:finite(z.flat()).reduce((rows,v,i)=>{const r=Math.floor(i/12);(rows[r]||(rows[r]=[])).push(v);return rows;},[]),
      x:monthNames,y:years,type:'heatmap',
      colorscale:[[0,'#B9653E'],[.5,'#F7F1E7'],[1,'#7C8452']],zmid:0,
      colorbar:{title:'vs moy.',tickformat:'.0%'},
      hovertemplate:'%{y} %{x}<br>%{z:.1%} vs moyenne annuelle<extra></extra>'
    }],`Heatmap — ${label}`,300,{margin:{l:65,r:72,t:55,b:45}});

    const xAll=periods.concat(future),nullHist=periods.map(()=>null);
    plot('r8-forecast',[
      {x:xAll,y:y.concat(Array(S.horizon).fill(null)),name:'Historique',mode:'lines+markers',type:'scatter',line:{color:C.sarcelle,width:2.5}},
      {x:xAll,y:nullHist.concat(p95hi),mode:'lines',type:'scatter',line:{width:0},showlegend:false,hoverinfo:'skip'},
      {x:xAll,y:nullHist.concat(p95lo),name:'Intervalle indicatif 95 %',mode:'lines',type:'scatter',fill:'tonexty',fillcolor:'rgba(177,120,45,.09)',line:{width:0}},
      {x:xAll,y:nullHist.concat(p80hi),mode:'lines',type:'scatter',line:{width:0},showlegend:false,hoverinfo:'skip'},
      {x:xAll,y:nullHist.concat(p80lo),name:'Intervalle indicatif 80 %',mode:'lines',type:'scatter',fill:'tonexty',fillcolor:'rgba(177,120,45,.18)',line:{width:0}},
      {x:xAll,y:nullHist.concat(fc.pred),name:'Prévision — '+selected,mode:'lines+markers',type:'scatter',line:{color:C.laiton,width:2.7}}
    ],`${label} — prévision ${S.horizon} mois`,420,{shapes:[{type:'line',xref:'x',yref:'paper',x0:periods.at(-1),x1:periods.at(-1),y0:0,y1:1,line:{color:C.grille,dash:'dash'}}]});

    wire();
    const st=document.getElementById('r8-state');
    if(st)st.textContent='Mis à jour '+new Date().toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'});
    setTimeout(()=>document.querySelectorAll('#p-r8 .js-plotly-plot').forEach(el=>{try{Plotly.Plots.resize(el);}catch(_){}}),80);
  }

  // Important : ne pas créer Plotly dans un onglet display:none.
  // On rend R8 après que le gestionnaire de navigation a rendu le panneau visible.
  panel.innerHTML='<p class="cpa-eyebrow">Time-series diagnostics & forecasting</p><h2>R8 · Analyse temporelle des flux de trésorerie</h2><div class="encart"><p>Ouvrez cet onglet pour charger les diagnostics et les séries détaillées.</p></div>';
  if(tabs){
    tabs.addEventListener('click',e=>{
      const b=e.target.closest('button');
      if(b&&b.dataset.cible==='p-r8'){
        requestAnimationFrame(()=>requestAnimationFrame(render));
      }
    });
  }
  if(panel.classList.contains('actif')) requestAnimationFrame(()=>requestAnimationFrame(render));
})();
</script>

</body>
</html>
