<style>

  header{border-bottom:1px solid var(--grille);padding:32px 2px 18px;margin-bottom:4px}

  .barre-onglets{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--grille);
                 position:sticky;top:0;background:var(--fond);z-index:20;padding-top:10px}
  .barre-onglets button{background:none;border:none;border-bottom:2px solid transparent;
       color:var(--attenue);font:inherit;font-size:0.88rem;padding:11px 15px;
       cursor:pointer;transition:color .15s,border-color .15s}
  .barre-onglets button:hover{color:var(--texte)}
  .barre-onglets button[aria-selected="true"]{color:var(--laiton);

  h3{font-size:0.95rem;font-weight:600;margin:28px 0 10px;color:var(--texte)}

  .kpi{background:var(--surface);border:1px solid var(--grille);border-top:3px solid var(--laiton);

  .kpi.ok{border-top-color:var(--sarcelle)}

  .duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}

  .graphe{background:var(--surface);border:1px solid var(--grille);border-radius:10px;padding:8px 10px 4px;margin:16px 0;box-shadow:0 2px 10px rgba(65,47,30,.035)}

  .liste-rapports span{color:var(--attenue);font-size:0.84rem}

/* --- Paramètres interactifs intégrés aux rapports --- */
.sim-panel{background:var(--surface);border:1px solid var(--grille);border-left:3px solid var(--laiton);border-radius:10px;margin:12px 0 22px;padding:15px 17px;box-shadow:0 2px 10px rgba(65,47,30,.035);position:relative;z-index:1}

.sim-panel .sim-title{font-weight:600;font-size:.92rem}
.sim-panel .sim-state{font-family:'IBM Plex Mono',monospace;font-size:.74rem;color:var(--sarcelle)}
.sim-panel .sim-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:10px}
.sim-panel .sim-group{background:var(--surface2);padding:11px 12px;border-radius:8px}
.sim-panel .sim-group h4{margin:0 0 8px;color:var(--texte);font-size:.82rem}
.sim-panel label{display:block;color:var(--attenue);font-size:.72rem;margin:7px 0 4px}
.sim-panel input[type=number],.sim-panel select{width:100%;background:var(--fond);color:var(--texte);border:1px solid var(--grille);border-radius:3px;padding:7px 8px;font:inherit;font-size:.82rem}
.sim-panel input[type=range]{width:100%;accent-color:var(--laiton)}
.sim-panel .range-val{font-family:'IBM Plex Mono',monospace;color:var(--texte);font-size:.76rem;float:right}
.sim-panel .sim-actions{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.sim-panel button{background:var(--laiton);color:#111;border:0;border-radius:3px;padding:8px 13px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer}
.sim-panel button.secondary{background:var(--surface2);color:var(--texte);border:1px solid var(--grille)}
.sim-panel .sim-help{color:var(--attenue);font-size:.74rem}
@media(max-width:650px){.sim-panel .sim-grid{grid-template-columns:1fr}}
.sim-highlight{border:1px solid var(--sarcelle)!important}

  /* Optimisation de lisibilité */
  .barre-onglets{backdrop-filter:blur(10px);background:rgba(246,241,233,.95)}

/* ---------- utilitaires de formatage ---------- */
const C = {laiton:'#B97724', sarcelle:'#5F6E59', rouge:'#B45636', bleu:'#765C47',
           violet:'#9B7657', vert:'#7A8053', orange:'#D39A4A', attenue:'#756658',
           grille:'#E4D8C8', surface:'#FFFEFB', texte:'#302820'};
const SEQ = [C.laiton, C.sarcelle, C.bleu, C.orange, C.violet, C.vert, C.rouge, '#A38E78'];

const nf = new Intl.NumberFormat('fr-CA', {maximumFractionDigits:0});
const nf2 = new Intl.NumberFormat('fr-CA', {minimumFractionDigits:2, maximumFractionDigits:2});
function $(v, d){ if(v===null||v===undefined||Number.isNaN(v)) return '—';
                  return (d===2?nf2:nf).format(v)+' $'; }
function pct(v, d){ if(v===null||v===undefined||Number.isNaN(v)) return '—';
                    return (v*100).toFixed(d===undefined?1:d).replace('.',',')+' %'; }

/* ---------- fabrique d'éléments ---------- */
function kpi(etiquette, valeur, etat){
  return `<div class="kpi ${etat||''}"><div class="etiquette">${etiquette}</div>
          <div class="valeur">${valeur}</div></div>`;
}
function bandeKpi(items){
  return `<div class="grille-kpi">${items.map(i=>kpi(i[0],i[1],i[2])).join('')}</div>`;
}
function tableau(entetes, lignes, options){
  const o = options||{};
  const th = entetes.map(h=>`<th>${h}</th>`).join('');
  const tr = lignes.map(l=>'<tr>'+l.map((c,i)=>{
      const num = (o.num||[]).includes(i);
      const cls = [num?'num':'', (o.classe? o.classe(l,i):'')].filter(Boolean).join(' ');
      return `<td${cls?` class="${cls}"`:''}>${c===null||c===undefined?'—':c}</td>`;
    }).join('')+'</tr>').join('');
  const t = `<table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table>`;

}

const CONFIG = {displayModeBar:false, responsive:true};

    ${tableau(['Mois','Statut','Budget','Projeté','Réel','Écart Réel − Budget',

      atterrir ? » C'est l'écart de pilotage : celui sur lequel on décide d'agir,
      parce qu'il reste du temps pour corriger.<br>
      <b>Fiabilité de la prévision</b> (Réel − Prévision figée) — « ma prévision
      valait-elle quelque chose ? » Elle juge le modèle, pas la gestion.</p>

function rendreR7(){
  const mc = D.r7.mc, bs = D.r7.bs, k = D.kpi;
  const statut = p => p>0.35 ? '🔴 Action requise' : p>0.05 ? '🟡 À surveiller'
                             : '🟢 Sous contrôle';
  const comp = [
    ['Solde final médian (P50)', mc.stats.mediane, bs.stats.mediane,
     'Le scénario central de chaque moteur.'],
    ['Solde final — P10 (défavorable)', mc.stats.p10, bs.stats.p10,
     'Un exercice sur dix se termine sous ce niveau.'],
    ['Solde final — P90 (favorable)', mc.stats.p90, bs.stats.p90,
     'Borne haute : à ne pas retenir pour planifier.'],
    ['Amplitude P10 – P90', mc.stats.p90-mc.stats.p10, bs.stats.p90-bs.stats.p10,
     "Largeur de l'incertitude : plus elle est grande, moins la prévision ponctuelle a de valeur."],
    ["Creux médian sur l'horizon", mc.stats.creux_median, bs.stats.creux_median,
     'Le point bas de la trajectoire, pas le solde de fin.'],
    ['Creux au P5 (stress)', mc.stats.creux_p5, bs.stats.creux_p5,
     'Scénario de tension : sert au dimensionnement de la marge de crédit.'],
    ['Coussin requis pour 95 % de sécurité', mc.risque.coussin_requis,
     bs.risque.coussin_requis,
     'Liquidité à ajouter pour tenir le seuil dans 95 % des cas.'],
    ['Écart-type du solde final', mc.stats.ecart_type, bs.stats.ecart_type,
     'Dispersion brute des résultats.']];

  document.getElementById('p-r7').innerHTML = `
    <h2>R7 · Synthèse des simulations — Monte-Carlo et bootstrap</h2>
    <p class="note">Deux façons de mesurer le même risque : un modèle paramétrique
       sur 12 mois (facturation, délai d'encaissement et charges tirés dans des lois
       calibrées sur 2026) et un rééchantillonnage par blocs des semaines réellement
       observées.</p>
    ${bandeKpi([
      ['Médiane — Monte-Carlo', $(mc.stats.mediane)],
      ['Médiane — Bootstrap', $(bs.stats.mediane)],
      ['P10 — Monte-Carlo', $(mc.stats.p10)],
      ['P10 — Bootstrap', $(bs.stats.p10)],
      ['Prob. sous le seuil (moy.)',
       pct((mc.risque.prob_sous_seuil+bs.risque.prob_sous_seuil)/2)]])}
    ${bandeKpi([
      ['Creux P5 — Monte-Carlo', $(mc.stats.creux_p5), 'alerte'],
      ['Creux P5 — Bootstrap', $(bs.stats.creux_p5)],
      ['Coussin — Monte-Carlo', $(mc.risque.coussin_requis)],
      ['Coussin — Bootstrap', $(bs.risque.coussin_requis)],
      ['Essais (MC + BS)', mc.risque.nb_essais + bs.risque.nb_essais]])}
    <h3>Comparaison des deux approches</h3>
    ${tableau(['Indicateur','Monte-Carlo · 12 mois','Bootstrap · 16 semaines',
               'Écart MC − BS','Lecture'],
      comp.map(r=>[r[0], $(r[1]), $(r[2]), $(r[1]-r[2]), r[3]]), {num:[1,2,3]})}
    <div class="encart"><p>Une divergence entre les deux colonnes n'est pas une
      erreur : elle mesure le poids des hypothèses de loi et de dépendance
      temporelle. Quand le bootstrap par blocs est plus sévère que le Monte-Carlo,
      c'est que l'historique récent enchaîne des semaines plus extrêmes que ne le
      suppose la loi normale, qui les traite comme indépendantes.</p></div>
    <div class="duo">${graphe('g-r7-mc-traj')}${graphe('g-r7-bs-traj')}</div>
    <div class="duo">${graphe('g-r7-mc-hist')}${graphe('g-r7-bs-hist')}</div>
    <div class="duo">${graphe('g-r7-perc')}${graphe('g-r7-prob')}</div>
    <h3>Lecture rapide — décision opérationnelle</h3>
    ${tableau(['Indicateur','Monte-Carlo · 12 mois','Bootstrap · 16 semaines'], [
      ['Marge de crédit disponible (Visa + exploitation)', $(k.marge_disponible),
       $(k.marge_disponible)],
      ['Coussin requis pour 95 % de sécurité', $(mc.risque.coussin_requis),
       $(bs.risque.coussin_requis)],
      ['Écart — marge disponible moins coussin requis',
       $(k.marge_disponible-mc.risque.coussin_requis),
       $(k.marge_disponible-bs.risque.coussin_requis)],
      ['Statut de liquidité', statut(mc.risque.prob_sous_seuil),
       statut(bs.risque.prob_sous_seuil)],
      ['Délai médian avant 1re rupture (essais touchés)',
       mc.risque.premiere_rupture_mediane+' mois',
       bs.risque.premiere_rupture_mediane+' semaines'],
      ["Probabilité qu'une rupture dure plus d'une période",
       pct(mc.risque.prob_rupture_prolongee), pct(bs.risque.prob_rupture_prolongee)]],
      {num:[1,2]})}
    <h3>Monte-Carlo — éventail du solde de trésorerie sur 12 mois</h3>
    ${graphe('g-r7-fan')}
    <p class="note">Chaque bande contient une part fixe des essais : la bande
       centrale foncée regroupe la moitié des trajectoires (P25 – P75), l'ensemble
       coloré en regroupe 90 % (P5 – P95). Le seuil doit rester sous la bande basse :
       dès qu'il entre dans la bande P5 – P25, plus d'un essai sur dix passe sous le
       seuil ce mois-là.</p>
    <h3>Trajectoires individuelles — échantillon de scénarios</h3>
    ${graphe('g-r7-traj-ind')}
    <p class="note">Ici chaque courbe est un exercice complet, cohérent d'un mois à
       l'autre. Le fan chart ci-dessus montre des probabilités mais aucune de ses
       bandes n'est un scénario : à chaque mois, le P90 est un essai différent.</p>`;

  function eventail(id, p, titre, unite){
    const x = p['50'].map((_,k)=>k);
    tracer(id, [
      {x, y:p['90'], mode:'lines', type:'scatter', line:{width:0}, showlegend:false,
       hoverinfo:'skip'},
      {x, y:p['10'], name:'P10 – P90', mode:'lines', type:'scatter', fill:'tonexty',
       fillcolor:'rgba(201,162,39,0.16)', line:{width:0}},
      {x, y:p['50'], name:'Médiane', mode:'lines', type:'scatter',
       line:{color:C.laiton, width:2.5}},
      ligneSeuil(x)],
      titre, 380, {xaxis:{title:unite, gridcolor:C.grille}});
  }
  eventail('g-r7-mc-traj', mc.percentiles,
           'Monte-Carlo — trajectoires mensuelles P10 / P50 / P90', 'Mois');
  eventail('g-r7-bs-traj', bs.percentiles,
           'Bootstrap — trajectoires hebdomadaires P10 / P50 / P90', 'Semaine');

  tracer('g-r7-mc-hist', [{x:mc.histogramme.map(b=>b.centre),
    y:mc.histogramme.map(b=>b.effectif), type:'bar', marker:{color:C.laiton}}],

  tracer('g-r7-bs-hist', [{x:bs.histogramme.map(b=>b.centre),
    y:bs.histogramme.map(b=>b.effectif), type:'bar', marker:{color:C.sarcelle}}],
    'Bootstrap — distribution du solde final', 340, {hovermode:'closest'});

  tracer('g-r7-perc', [
    {x:['P10','Médiane','P90'], y:[mc.stats.p10, mc.stats.mediane, mc.stats.p90],
     name:'Monte-Carlo', type:'bar', marker:{color:C.laiton}},
    {x:['P10','Médiane','P90'], y:[bs.stats.p10, bs.stats.mediane, bs.stats.p90],
     name:'Bootstrap', type:'bar', marker:{color:C.sarcelle}}],
    'Solde final — percentiles comparés', 340, {hovermode:'closest'});

  const lib = ['Sous le seuil','Découvert','Sous le solde de départ'];
  tracer('g-r7-prob', [
    {x:lib, y:[mc.risque.prob_sous_seuil, mc.risque.prob_decouvert,
               mc.risque.prob_sous_depart], name:'Monte-Carlo', type:'bar',
     marker:{color:C.laiton}},
    {x:lib, y:[bs.risque.prob_sous_seuil, bs.risque.prob_decouvert,
               bs.risque.prob_sous_depart], name:'Bootstrap', type:'bar',
     marker:{color:C.sarcelle}}],
    'Probabilités de risque comparées', 340,
    {hovermode:'closest', yaxis:{tickformat:'.0%', gridcolor:C.grille}});

  const p = mc.percentiles, xf = p['50'].map((_,k)=>k);
  const bandes = [];
  [['95','5',0.10,'P5 – P95'], ['75','25',0.22,'P25 – P75']].forEach(b=>{
    bandes.push({x:xf, y:p[b[0]], mode:'lines', type:'scatter', line:{width:0},
                 showlegend:false, hoverinfo:'skip'});
    bandes.push({x:xf, y:p[b[1]], name:b[3], mode:'lines', type:'scatter',
                 fill:'tonexty', fillcolor:`rgba(201,162,39,${b[2]})`, line:{width:0}});
  });
  bandes.push({x:xf, y:p['50'], name:'Médiane', mode:'lines', type:'scatter',
               line:{color:C.laiton, width:2.5}});
  bandes.push(ligneSeuil(xf));
  tracer('g-r7-fan', bandes, null, 420, {xaxis:{title:'Mois', gridcolor:C.grille}});

  const courbes = mc.trajectoires.map((t,i)=>({x:t.map((_,k)=>k), y:t, mode:'lines',
    type:'scatter', line:{width:1.2}, opacity:0.75, showlegend:false,
    name:'Essai '+(i+1)}));
  courbes.push(Object.assign(ligneSeuil(mc.trajectoires[0].map((_,k)=>k)),
                             {showlegend:true, line:{color:C.rouge, width:2, dash:'dash'}}));
  tracer('g-r7-traj-ind', courbes, null, 420,
         {xaxis:{title:'Mois', gridcolor:C.grille}, hovermode:'closest'});
}

function rollingInteractive(){
  const [eRev,eFix]=SCEN[SIM.scenario]; const factRev=(1+eRev)*(1+SIM.adjRev); const factChg=(1+eFix)*(1+SIM.adjChg);
  let solde=SIM.solde_depart, restant=BASE_PARAMS.forecast.solde_financement, out=[];
  for(let n=1;n<=SIM.horizon;n++){
    const enc=(n>=BASE_PARAMS.forecast.premiere_semaine_encaissement && ((n-BASE_PARAMS.forecast.premiere_semaine_encaissement)%SIM.frequence===0))?SIM.cycleEncaissement*factRev:0;
    let fixes=SIM.fixes; if(n>=5 && (n-5)%4===0) fixes+=SIM.bloc; fixes*=factChg;
    const vars=SIM.vars*factChg;
    const plan=(n>=BASE_PARAMS.forecast.premiere_semaine_plan && n<BASE_PARAMS.forecast.premiere_semaine_plan+BASE_PARAMS.forecast.duree_plan_semaines);
    const remb=plan?Math.min(SIM.paiement,restant):0; restant-=remb;
    const net=enc-fixes-vars-remb; solde+=net;
    out.push({n,encaissements:enc,charges_fixes:fixes,charges_variables:vars,remboursement:remb,flux_net:net,solde,seuil:SIM.seuil,
      etiquette:'S'+n,alerte:solde<SIM.seuil?'⚠':''});
  }
  return out;
}
function percent(a,p){if(!a.length)return 0; const s=a.slice().sort((x,y)=>x-y), k=(s.length-1)*p/100, f=Math.floor(k), c=Math.ceil(k); return s[f] + (s[c]-s[f])*(k-f);}
function runBootstrap(){
  const real=D.r1.semaines.filter(x=>x.statut==='Réel'); const sorties=real.map(x=>cp(x.sorties)); const encObs=real.filter(x=>cp(x.entrees)>0).map(x=>cp(x.entrees));
  const rng=mulberry32(SIM.graine+1), n=Math.max(100,Math.min(1500,SIM.nBS)), h=Math.max(4,Math.min(52,BASE_PARAMS.bootstrap.horizon_semaines)), b=Math.max(1,SIM.blocBS), cyc=Math.max(1,SIM.frequence);
  const paths=[]; const finals=[]; const troughs=[];
  for(let e=0;e<n;e++){
    let solde=SIM.solde_depart, path=[solde]; let outs=[];
    let remain=h; while(remain>0){const start=Math.floor(rng()*sorties.length); for(let j=0;j<b && remain>0;j++,remain--) outs.push(sorties[(start+j)%sorties.length]);}
    for(let w=1;w<=h;w++){let inC=0;if(w%cyc===1)inC=encObs[Math.floor(rng()*encObs.length)];solde+=inC-outs[w-1];path.push(solde);} 
    paths.push(path); finals.push(solde); troughs.push(Math.min(...path.slice(1)));
  }
  const p10=[];const p50=[];const p90=[]; for(let j=0;j<=h;j++){const a=paths.map(x=>x[j]);p10.push(percent(a,10));p50.push(percent(a,50));p90.push(percent(a,90));}
  const stats={mediane:percent(finals,50),p10:percent(finals,10),p90:percent(finals,90),creux_p5:percent(troughs,5),
    prob_sous_seuil:troughs.filter(x=>x<SIM.seuil).length/n,prob_decouvert:troughs.filter(x=>x<0).length/n,
    periodes_sous_seuil_moy:paths.reduce((s,path)=>s+path.slice(1).filter(x=>x<SIM.seuil).length,0)/n,

function randn(rng){let u=0,v=0;while(u===0)u=rng();while(v===0)v=rng();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}

function runMC(){

  const rev=BASE_PARAMS.monte_carlo.revenus_moyenne, revsd=BASE_PARAMS.monte_carlo.revenus_ecart_type;

  const fixM=BASE_PARAMS.monte_carlo.charges_fixes_moyenne, fixSD=BASE_PARAMS.monte_carlo.charges_fixes_ecart_type;
  const dsoSD=BASE_PARAMS.monte_carlo.dso_ecart_type, service=BASE_PARAMS.monte_carlo.service_financement_mensuel, inv=BASE_PARAMS.monte_carlo.investissements_mensuels;
  const effect=SIM.effetRupture, pR=SIM.probRupture, shockP=BASE_PARAMS.monte_carlo.prob_choc, shockAmt=BASE_PARAMS.monte_carlo.ampleur_choc;
  const finals=[], troughs=[], paths=[]; const ptiles=Array(7).fill(null).map(()=>[]);

  const st={mediane:percent(finals,50),p10:percent(finals,10),p90:percent(finals,90),p5:percent(finals,5),creux_p5:percent(troughs,5),

  document.getElementById('p-r7').innerHTML='<h2>R7 · Synthèse Monte-Carlo + bootstrap — interactif</h2>'+panneauR7()+'<p class="note">Monte-Carlo '+mc.stats.nb_essais+' essais · croissance mensuelle '+(SIM.growth*100).toFixed(1).replace('.',',')+' % · DSO '+SIM.dso+' j · rupture '+(SIM.probRupture*100).toFixed(0)+' %.</p>'+r7Kpis+'<div class="duo">'+graphe('gx-r7-mc-traj')+graphe('gx-r7-bs-traj')+'</div><div class="duo">'+graphe('gx-r7-mc-hist')+graphe('gx-r7-bs-hist')+'</div><div class="duo">'+graphe('gx-r7-perc')+graphe('gx-r7-prob')+'</div><h3>Monte-Carlo — éventail du solde de trésorerie sur 12 mois</h3>'+graphe('gx-r7-fan')+'<h3>Trajectoires individuelles — échantillon de scénarios</h3>'+graphe('gx-r7-traj-ind');

  const mx=Array.from({length:mc.ptiles[3].length},(_,i)=>i);
  function eventailDyn(id, top, low, med, titre, unite){
    tracer(id,[{x:mx.slice(0,med.length),y:top,mode:'lines',type:'scatter',line:{width:0},showlegend:false,hoverinfo:'skip'},{x:mx.slice(0,med.length),y:low,name:'P10 – P90',mode:'lines',type:'scatter',fill:'tonexty',fillcolor:'rgba(177,120,45,.16)',line:{width:0}},{x:mx.slice(0,med.length),y:med,name:'Médiane',mode:'lines',type:'scatter',line:{color:C.laiton,width:2.5}},ligneSeuil(mx.slice(0,med.length))],titre,380,{xaxis:{title:unite, gridcolor:C.grille}});
  }
  eventailDyn('gx-r7-mc-traj', mc.ptiles[5], mc.ptiles[1], mc.ptiles[3], 'MONTE-CARLO — TRAJECTOIRES MENSUELLES P10 / P50 / P90', 'Mois');
  const bsx=Array.from({length:r3.p50.length},(_,i)=>i);
  tracer('gx-r7-bs-traj',[{x:bsx,y:r3.p90,mode:'lines',type:'scatter',line:{width:0},showlegend:false,hoverinfo:'skip'},{x:bsx,y:r3.p10,name:'P10 – P90',mode:'lines',type:'scatter',fill:'tonexty',fillcolor:'rgba(201,150,85,.18)',line:{width:0}},{x:bsx,y:r3.p50,name:'Médiane',mode:'lines',type:'scatter',line:{color:C.sarcelle,width:2.5}},ligneSeuil(bsx)],'BOOTSTRAP — TRAJECTOIRES HEBDOMADAIRES P10 / P50 / P90',380,{xaxis:{title:'Semaine', gridcolor:C.grille}});
  const hh={};mc.finals.forEach(v=>{const k=Math.round(v/100000)*100000;hh[k]=(hh[k]||0)+1}); const q=Object.keys(hh).map(Number).sort((a,b)=>a-b);tracer('gx-r7-mc-hist',[{x:q,y:q.map(k=>hh[k]),type:'bar',name:'Essais',marker:{color:C.laiton}}],'MONTE-CARLO — DISTRIBUTION DU SOLDE FINAL',340,{hovermode:'closest'});
  tracer('gx-r7-bs-hist',[{x:hx,y:hx.map(k=>hst[k]),type:'bar',name:'Essais',marker:{color:C.sarcelle}}],'BOOTSTRAP — DISTRIBUTION DU SOLDE FINAL',340,{hovermode:'closest'});
  tracer('gx-r7-perc', [{x:['P10','Médiane','P90'], y:[mc.stats.p10, mc.stats.mediane, mc.stats.p90], name:'Monte-Carlo', type:'bar', marker:{color:C.laiton}}, {x:['P10','Médiane','P90'], y:[r3.stats.p10, r3.stats.mediane, r3.stats.p90], name:'Bootstrap', type:'bar', marker:{color:C.sarcelle}}], 'SOLDE FINAL — PERCENTILES COMPARÉS', 340, {hovermode:'closest'});
  tracer('gx-r7-prob', [{x:['Sous le seuil','Découvert'], y:[mc.stats.prob_sous_seuil, mc.stats.prob_decouvert], name:'Monte-Carlo', type:'bar', marker:{color:C.laiton}}, {x:['Sous le seuil','Découvert'], y:[r3.stats.prob_sous_seuil, r3.stats.prob_decouvert], name:'Bootstrap', type:'bar', marker:{color:C.sarcelle}}], 'PROBABILITÉS DE RISQUE COMPARÉES', 340, {hovermode:'closest', yaxis:{tickformat:'.0%'}});
  const fanx=Array.from({length:mc.ptiles[3].length},(_,i)=>i);
  tracer('gx-r7-fan',[
    {x:fanx,y:mc.ptiles[6],mode:'lines',type:'scatter',line:{width:0},showlegend:false,hoverinfo:'skip'},
    {x:fanx,y:mc.ptiles[0],name:'P5 – P95',mode:'lines',type:'scatter',fill:'tonexty',fillcolor:'rgba(177,120,45,.10)',line:{width:0}},
    {x:fanx,y:mc.ptiles[4],mode:'lines',type:'scatter',line:{width:0},showlegend:false,hoverinfo:'skip'},
    {x:fanx,y:mc.ptiles[2],name:'P25 – P75',mode:'lines',type:'scatter',fill:'tonexty',fillcolor:'rgba(177,120,45,.22)',line:{width:0}},
    {x:fanx,y:mc.ptiles[3],name:'Médiane',mode:'lines',type:'scatter',line:{color:C.laiton,width:2.5}},
    ligneSeuil(fanx)], 'MONTE-CARLO — ÉVENTAIL DU SOLDE DE TRÉSORERIE SUR 12 MOIS', 420, {xaxis:{title:'Mois', gridcolor:C.grille}});
  const pathsToShow = mc.paths.slice(0, Math.min(12, mc.paths.length)).map((t,i)=>({x:t.map((_,k)=>k), y:t, mode:'lines', type:'scatter', line:{width:1.1}, opacity:0.75, showlegend:false, name:'Essai '+(i+1)}));
  pathsToShow.push(Object.assign(ligneSeuil(mc.paths[0].map((_,k)=>k)), {showlegend:true, line:{color:C.rouge, width:2, dash:'dash'}}));
  tracer('gx-r7-traj-ind', pathsToShow, 'MONTE-CARLO — TRAJECTOIRES SIMULÉES, MOIS PAR MOIS', 420, {xaxis:{title:'Mois', gridcolor:C.grille}, hovermode:'closest'});

  // R1 badge + seuil dynamique.
  const min=Math.min(...r2.map(r=>r.solde)), fin=r2.at(-1).solde;
  document.getElementById('p-r1').querySelector('.note')?.insertAdjacentHTML('beforebegin',`<div id="sim-r1-badge" class="encart sim-highlight"><p><b>Simulation active :</b> solde final ${money(fin)} · creux ${money(min)} · ${r2.filter(r=>r.solde<SIM.seuil).length} semaine(s) sous le seuil de ${money(SIM.seuil)}. <a href="#p-r2" style="color:var(--laiton)">Voir R2 interactif</a>.</p></div>`);
  if(window.Plotly){['g-r1-cycle'].forEach(id=>{const el=document.getElementById(id);if(el&&el.data&&el.data.length){const idx=el.data.length-1;Plotly.restyle(id,{y:[el.data[idx].x.map(()=>SIM.seuil)]},[idx]).catch(()=>{});}});}
  initControls(); wireControls();
  const state=document.getElementById('sim-state'); if(state) state.textContent=`Mis à jour ${new Date().toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}`;
}
function rollingForScenario(nom){const old=SIM.scenario;SIM.scenario=nom;const r=rollingInteractive();SIM.scenario=old;return r.at(-1).solde}
let simTimer=null;
function schedule(){clearTimeout(simTimer);simTimer=setTimeout(()=>{document.querySelectorAll('#sim-r1-badge').forEach(x=>x.remove());try{rerenderDynamic()}catch(err){console.error(err);document.getElementById('sim-state').textContent='Erreur de calcul'}} ,350)}
function wireControls(){
  document.querySelectorAll('.sim-panel input,.sim-panel select').forEach(el=>{el.addEventListener('input',()=>{majLabels();schedule()});el.addEventListener('change',()=>{majLabels();schedule()})});
  document.getElementById('btn-reset')?.addEventListener('click',()=>{Object.assign(SIM,{scenario:'Base',solde_depart:BASE_PARAMS.forecast.solde_depart,seuil:BASE_PARAMS.general.seuil_securite,horizon:BASE_PARAMS.forecast.horizon_semaines,adjRev:0,adjChg:0,cycleEncaissement:BASE_PARAMS.forecast.encaissement_par_cycle,frequence:BASE_PARAMS.forecast.frequence_encaissement,paiement:BASE_PARAMS.forecast.paiement_hebdo_financement,fixes:BASE_PARAMS.forecast.charges_recurrentes_hebdo,vars:BASE_PARAMS.forecast.charges_variables_hebdo,bloc:BASE_PARAMS.forecast.bloc_charges_fixes_mensuel,growth:BASE_PARAMS.monte_carlo.croissance_mensuelle,dso:BASE_PARAMS.monte_carlo.dso_moyen,probRupture:BASE_PARAMS.monte_carlo.prob_rupture_contrat,effetRupture:BASE_PARAMS.monte_carlo.effet_rupture});initControls();schedule()});
  document.getElementById('btn-simulation')?.addEventListener('click',()=>{lireControls();SIM.graine=Math.floor(Math.random()*1000000000);schedule()});
}
rerenderDynamic();

</script>

  .cpa-eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--laiton);font-weight:700;margin:0 0 4px}
  .cpa-status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0 22px}
  .cpa-status{background:var(--surface);border:1px solid var(--grille);border-radius:8px;padding:14px 16px}
  .cpa-status .top{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .cpa-status .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .cpa-status.ok .dot{background:var(--vert)}
  .cpa-status.warn .dot{background:var(--orange)}
  .cpa-status.bad .dot{background:var(--rouge)}
  .cpa-status strong{font-size:.88rem}
  .cpa-status span{display:block;color:var(--attenue);font-size:.78rem;line-height:1.4}
  .cpa-callout{background:var(--surface2);border:1px solid var(--grille);border-radius:7px;padding:14px 16px;margin:14px 0}
  .cpa-callout strong{font-size:.86rem}
  .cpa-callout p{margin:4px 0 0;color:var(--attenue);font-size:.8rem}
  .cpa-section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .cpa-section-title small{color:var(--attenue);font-weight:400;font-size:.75rem}
  .cpa-subtle{color:var(--attenue);font-size:.76rem}
  @media(max-width:800px){.cpa-status-grid{grid-template-columns:1fr}}
</style>

<script id="cpa-treasury-proposal-script">
(function(){
  const minRow = rows => rows.reduce((a,b)=>Number(b.solde)<Number(a.solde)?b:a, rows[0]);
  const max0 = n => Math.max(0, Number(n)||0);
  const etat = (kind, title, text) => `<div class="cpa-status ${kind}"><div class="top"><span class="dot"></span><strong>${title}</strong></div><span>${text}</span></div>`;
  const lineSeuilCPA = (x,seuil,nom='Seuil de sécurité') => ({x, y:x.map(()=>seuil), name:nom, mode:'lines', type:'scatter', line:{color:C.rouge,width:1.5,dash:'dash'}});
  const pctCPA = n => pct(Number(n)||0);

  function renommerOnglets(){
    const labels = {
      'p-accueil':'Accueil · Cockpit',
      'p-r0':'R0 · Sommaire',
      'p-r1':'R1 · Liquidité 13 sem.',
      'p-r2':'R2 · Rolling forecast',
      'p-r3':'R3 · Stress court terme',
      'p-r4':'R4 · Sources & utilisations',
      'p-r5':'R5 · Écarts de trésorerie',
      'p-r6':'R6 · Contrôles',
      'p-r7':'R7 · Risque & financement'
    };
    document.querySelectorAll('#onglets button').forEach(b=>{
      if(labels[b.dataset.cible]) b.textContent=labels[b.dataset.cible];
    });
  }

  function rendreAccueilCPA(){
    const k=D.kpi, min=minRow(D.r1.semaines);
    const liquidite=k.solde_actuel+k.marge_disponible;
    const couverture=k.marge_disponible-k.coussin_requis;
    const budgetNet=k.flux_net_2026-k.ecart_budget_annee;
    const ecartPct=budgetNet? k.ecart_budget_annee/budgetNet:0;
    document.getElementById('p-accueil').innerHTML=`
      <p class="cpa-eyebrow">Cockpit trésorerie · Contrôle corporatif</p>
      <h2>Position de trésorerie — vue de pilotage</h2>
      <p class="note">Une lecture rapide de la liquidité, du financement et de l'atterrissage de trésorerie.
      Les analyses détaillées et les hypothèses restent dans R1 à R7.</p>
      ${bandeKpi([
        ['Solde actuel',$(k.solde_actuel)],
        ['Liquidité disponible',$(liquidite),'ok'],
        ['Creux 13 semaines',$(k.creux),k.creux<k.seuil?'alerte':'ok'],
        ['Semaine du creux',min.libelle],
        ['Utilisation marge',pct(k.utilisation_marge)],
        ['Couverture après stress',$(couverture),couverture>=0?'ok':'alerte']])}
      ${bandeKpi([
        ['Écart forecast vs budget',$(k.ecart_budget_annee),k.ecart_budget_annee<0?'alerte':'ok'],
        ['Écart forecast vs budget %',pct(ecartPct),ecartPct<0?'alerte':'ok'],
        ['Coussin P95 requis',$(k.coussin_requis)],
        ['Dette revolving',$(k.dette_revolving)],
        ['Semaines sous seuil',k.semaines_sous_seuil+' / '+k.nb_semaines],
        ['Seuil de sécurité',$(k.seuil)]])}
      <div class="cpa-status-grid">
        ${etat(k.creux<0?'bad':k.creux<k.seuil?'warn':'ok','Liquidité 13 semaines',
          k.creux<k.seuil?'Le cycle passe sous le seuil : suivi rapproché requis.':'Le cycle reste au-dessus du seuil.')}
        ${etat(couverture<0?'bad':couverture<100000?'warn':'ok','Capacité de financement',
          `Marge disponible moins coussin P95 : ${$(couverture)}.`)}
        ${etat(k.ecart_budget_annee<0?'warn':'ok','Atterrissage de trésorerie',
          `Forecast annuel vs budget : ${$(k.ecart_budget_annee)}.`)}
      </div>
      <h2>Rapports de trésorerie</h2>
      <div class="liste-rapports">
        <div><strong>R0 · Sommaire exécutif</strong><span>Position, alertes et décisions de trésorerie.</span></div>
        <div><strong>R1 · Liquidité 13 semaines</strong><span>Cycle court terme, headroom et capacité revolving.</span></div>
        <div><strong>R2 · Rolling forecast</strong><span>Scénarios, sensibilités et trajectoire réel / forecast / budget.</span></div>
        <div><strong>R3 · Stress court terme</strong><span>Bootstrap historique et risque de rupture semaine par semaine.</span></div>
        <div><strong>R4 · Sources & utilisations</strong><span>Origine et utilisation des flux de trésorerie.</span></div>
        <div><strong>R5 · Écarts de trésorerie</strong><span>Budget vs forecast vs réel et causes de la dérive.</span></div>
        <div><strong>R6 · Contrôles</strong><span>Qualité des données, classement et anomalies du journal.</span></div>
        <div><strong>R7 · Risque & financement</strong><span>Risque 12 mois, coussin P95 et capacité de financement.</span></div>
      </div>`;
  }

  function rendreR0CPA(){
    const k=D.kpi, r=D.r0, min=minRow(D.r1.semaines);
    const couverture=k.marge_disponible-k.coussin_requis;
    const liquidite=k.solde_actuel+k.marge_disponible;
    document.getElementById('p-r0').innerHTML=`
      <p class="cpa-eyebrow">Executive treasury summary</p>
      <h2>R0 · Sommaire exécutif de trésorerie</h2>
      <p class="note">Synthèse de contrôle : position, tension de liquidité, financement et actions requises.</p>
      <div class="encart"><p>La trésorerie demeure positive, mais le cycle de 13 semaines atteint un creux de
      <b>${$(k.creux)}</b> durant <b>${min.libelle}</b>, sous le seuil de ${$(k.seuil)}.
      La capacité de crédit disponible couvre encore le coussin P95 de ${$(k.coussin_requis)}, avec une couverture résiduelle
      de <b>${$(couverture)}</b>. L'atterrissage annuel demeure inférieur au budget de <b>${$(Math.abs(k.ecart_budget_annee))}</b>.</p></div>
      ${bandeKpi([
        ['Solde actuel',$(k.solde_actuel)],
        ['Liquidité disponible',$(liquidite),'ok'],
        ['Creux 13 semaines',$(k.creux),k.creux<k.seuil?'alerte':'ok'],
        ['Semaine du creux',min.libelle],
        ['Utilisation marge',pct(k.utilisation_marge)],
        ['Couverture après stress',$(couverture),couverture>=0?'ok':'alerte']])}
      <div class="cpa-status-grid">
        ${etat(k.creux<k.seuil?'warn':'ok','Liquidité','Le seuil de sécurité est la référence opérationnelle de R1.')}
        ${etat(couverture<0?'bad':couverture<100000?'warn':'ok','Financement',`Couverture résiduelle après stress : ${$(couverture)}.`)}
        ${etat(k.ecart_budget_annee<0?'warn':'ok','Forecast',`Dérive annuelle : ${$(k.ecart_budget_annee)}.`)}
      </div>
      ${graphe('cpa-r0-traj')}
      <h3>Points d'attention</h3>
      ${tableau(['Priorité','Constat','Impact trésorerie','Action de contrôle'],[
        ['1','Creux sous le seuil',`${$(k.creux)} vs seuil ${$(k.seuil)}`,'Suivre les encaissements et le calendrier de décaissements chaque semaine.'],
        ['2','Utilisation de la marge',pct(k.utilisation_marge),'Protéger la capacité non utilisée et revoir la limite avant une période de tension.'],
        ['3','Forecast sous le budget',$(k.ecart_budget_annee),'Documenter la cause de l’écart et mettre à jour le rolling forecast.']
      ])}
      <h3>Décisions / actions proposées</h3>
      ${tableau(['#','Décision','Échéance','Raison'],
        r.decisions.map(x=>[x.n,x.decision,x.echeance,x.pourquoi]))}`;
    const t=r.trajectoire;
    tracer('cpa-r0-traj',[
      {x:t.labels,y:t.solde,name:'Solde de trésorerie',mode:'lines+markers',type:'scatter',line:{color:C.laiton,width:2.8}},
      lineSeuilCPA(t.labels,k.seuil)
    ],'Trajectoire de trésorerie — 13 semaines',390);
  }

  function rendreR1CPA(){
    const s=D.r1.semaines, f=D.r1.facilites, i=D.r1.indicateurs, min=minRow(s);
    const margeDisp=f.reduce((a,x)=>a+Number(x.disponible||0),0);
    const liquidite=i.solde_actuel+margeDisp;
    const totalLimites=f.reduce((a,x)=>a+Number(x.limite||0),0);
    const proj=s.filter(x=>x.statut==='Projeté');
    const amort=D.r1.amortissement.slice(1,1+proj.length);
    const head=proj.map((x,idx)=>{
      const dette=amort[idx]?Number(amort[idx].total):D.kpi.dette_revolving;
      const dispo=Math.max(0,totalLimites-dette);
      return {libelle:x.libelle,solde:Number(x.solde),dispo,headroom:Number(x.solde)+dispo-i.seuil};
    });
    const minHead=head.length?Math.min(...head.map(x=>x.headroom)):i.solde_actuel+margeDisp-i.seuil;
    document.getElementById('p-r1').innerHTML=`
      <p class="cpa-eyebrow">13-week cash position</p>
      <h2>R1 · Liquidité immédiate — 13 semaines</h2>
      <p class="note">Rapport opérationnel principal : position de cash, point bas, disponibilité des facilités et headroom.</p>
      ${bandeKpi([
        ['Solde actuel',$(i.solde_actuel)],
        ['Crédit disponible',$(margeDisp),'ok'],
        ['Liquidité actuelle',$(liquidite),'ok'],
        ['Creux du cycle',$(i.creux),i.creux<i.seuil?'alerte':'ok'],
        ['Semaine du creux',min.libelle],
        ['Headroom min. projeté',$(minHead),minHead<0?'alerte':'ok']])}
      ${graphe('cpa-r1-cycle')}
      <div class="duo">${graphe('cpa-r1-headroom')}${graphe('cpa-r1-facilites')}</div>
      <div class="cpa-callout"><strong>Lecture de contrôle</strong>
        <p>Le headroom projeté combine le solde de trésorerie et la disponibilité estimée sur les facilités, après le remboursement revolving prévu.
        Il mesure la capacité résiduelle au-dessus du seuil de sécurité.</p></div>
      <details><summary>Plan de remboursement du financement revolving</summary>
        ${tableau(['Facilité','Solde actuel','Paiement hebdo','Limite','Utilisation','Util. finale'],
          D.r1.repartition.map(r=>[r.facilite,$(r.solde_actuel),$(r.paiement_hebdo),$(r.limite),pct(r.utilisation_actuelle),pct(r.utilisation_finale)]),
          {num:[1,2,3,4,5]})}
      </details>
      <details><summary>Détail hebdomadaire</summary>
        ${tableau(['Semaine','Statut','Entrées','Sorties','Net','Solde','Note'],
          s.map(x=>[x.libelle,x.statut,$(x.entrees),$(x.sorties),$(x.net),$(x.solde),x.note||'']),
          {num:[2,3,4,5],defilement:true})}
      </details>`;
    const lib=s.map(x=>x.libelle);
    tracer('cpa-r1-cycle',[
      {x:lib,y:s.map(x=>x.entrees),name:'Encaissements',type:'bar',marker:{color:C.sarcelle}},
      {x:lib,y:s.map(x=>-x.sorties),name:'Décaissements',type:'bar',marker:{color:C.rouge}},
      {x:lib,y:s.map(x=>x.solde),name:'Solde',mode:'lines+markers',type:'scatter',yaxis:'y2',line:{color:C.laiton,width:2.6}},
      Object.assign(lineSeuilCPA(lib,i.seuil),{yaxis:'y2'})
    ],'Cycle de trésorerie — réel + projection',430,{barmode:'relative',yaxis2:{overlaying:'y',side:'right',showgrid:false}});
    tracer('cpa-r1-headroom',[
      {x:head.map(x=>x.libelle),y:head.map(x=>x.headroom),name:'Headroom au-dessus du seuil',type:'bar',
       marker:{color:head.map(x=>x.headroom<0?C.rouge:C.sarcelle)}},
      {x:head.map(x=>x.libelle),y:head.map(()=>0),name:'Limite',mode:'lines',type:'scatter',line:{color:C.attenue,dash:'dash'}}
    ],'Headroom de liquidité — semaines projetées',360,{hovermode:'closest'});
    tracer('cpa-r1-facilites',[
      {x:f.map(x=>x.facilite),y:f.map(x=>x.solde),name:'Utilisé',type:'bar',marker:{color:C.rouge}},
      {x:f.map(x=>x.facilite),y:f.map(x=>x.disponible),name:'Disponible',type:'bar',marker:{color:C.sarcelle}}
    ],'Facilités revolving — utilisé vs disponible',360,{barmode:'stack',hovermode:'closest'});
  }

  function rendreR4CPA(){
    const r=D.r4, f=r.flux_mensuel, mois=D.mois;
    document.getElementById('p-r4').innerHTML=`
      <p class="cpa-eyebrow">Cash sources & uses</p>
      <h2>R4 · Sources et utilisations de trésorerie</h2>
      <p class="note">Lecture des encaissements, décaissements et postes qui consomment le plus de trésorerie.</p>
      ${bandeKpi([
        ['Encaissements 2026',$(r.kpi.revenus)],
        ['Décaissements 2026',$(r.kpi.depenses)],
        ['Flux net 2026',$(r.kpi.flux_net),r.kpi.flux_net>=0?'ok':'alerte'],
        ['Part charges fixes',pct(r.kpi.part_fixes)],
        ['Part charges variables',pct(r.kpi.part_variables)]])}
      ${graphe('cpa-r4-sources')}
      <div class="duo">${graphe('cpa-r4-net')}${graphe('cpa-r4-top')}</div>
      <details><summary>Détail des catégories de revenus</summary>
        ${tableau(['Catégorie de revenu','Total 2026','% du total'],
          r.revenus_categorie.map(x=>[x.categorie,$(x.montant),pct(x.part)]),{num:[1,2]})}
      </details>`;
    tracer('cpa-r4-sources',[
      {x:mois,y:f.map(x=>x.revenus),name:'Encaissements',type:'bar',marker:{color:C.sarcelle}},
      {x:mois,y:f.map(x=>-x.frais_variables),name:'Charges variables',type:'bar',marker:{color:C.orange}},
      {x:mois,y:f.map(x=>-x.frais_fixes),name:'Charges fixes',type:'bar',marker:{color:C.bleu}},
      {x:mois,y:f.map(x=>-x.financement),name:'Financement',type:'bar',marker:{color:C.violet}}
    ],'Sources et utilisations de cash — par mois',410,{barmode:'relative'});
    tracer('cpa-r4-net',[
      {x:mois,y:f.map(x=>x.flux_net),type:'bar',name:'Flux net',
       marker:{color:f.map(x=>x.flux_net>=0?C.sarcelle:C.rouge)}},
      {x:mois,y:f.map(()=>0),mode:'lines',type:'scatter',name:'Zéro',line:{color:C.attenue,dash:'dash'}}
    ],'Flux net mensuel',360,{hovermode:'closest'});
    const top=r.top10.slice().sort((a,b)=>a.montant-b.montant);
    tracer('cpa-r4-top',[{y:top.map(x=>x.categorie),x:top.map(x=>x.montant),orientation:'h',type:'bar',
      marker:{color:top.map(x=>x.nature==='Variable'?C.orange:x.nature==='Fixe'?C.bleu:C.violet)}}],
      'Principales utilisations de trésorerie — Top 10',390,{hovermode:'closest',margin:{l:210,r:20,t:52,b:45}});
  }

  function rendreR5CPA(){
    const e=D.r5;
    const derFlux=e.derive.find(x=>x.poste==='Flux net')||e.derive[0];
    const perfMat=e.performance.filter(x=>String(x.materialite||'').includes('⚠')).length;
    const derMat=e.derive.filter(x=>String(x.materialite||'').includes('⚠')).length;
    document.getElementById('p-r5').innerHTML=`
      <p class="cpa-eyebrow">Cash variance control</p>
      <h2>R5 · Écarts de trésorerie — budget / forecast / réel</h2>
      <p class="note">Rapport de reddition et de pilotage : où l'exercice dérive, de combien et pourquoi.</p>
      ${bandeKpi([
        ['Écart annuel flux net',$(derFlux.ecart),derFlux.ecart<0?'alerte':'ok'],
        ['Écart annuel %',pct(derFlux.ecart_pct),derFlux.ecart_pct<0?'alerte':'ok'],
        ['Écarts matériels — réel',String(perfMat)],
        ['Écarts matériels — forecast',String(derMat)],
        ['Poste analysé',e.poste]])}
      ${graphe('cpa-r5-waterfall')}
      ${graphe('cpa-r5-cumul')}
      <div class="cpa-callout"><strong>Forecast accuracy — contrôle à développer</strong>
        <p>La base actuelle ne conserve pas les snapshots historiques de forecast. La précision à 1, 4 et 13 semaines ne peut donc pas être calculée de façon fiable dans cette version.</p></div>
      <details><summary>Écart de performance — réel vs budget</summary>
        ${tableau(['Poste','Budget cumulé','Réel cumulé','Écart $','Écart %','Sens','Matérialité','Cause'],
          e.performance.map(r=>[r.poste,$(r.budget_cumule),$(r.reel_cumule),$(r.ecart),pct(r.ecart_pct),r.sens,r.materialite,r.cause]),{num:[1,2,3,4]})}
      </details>
      <details><summary>Dérive de prévision — forecast annuel vs budget</summary>
        ${tableau(['Poste','Budget annuel','Forecast annuel','Écart $','Écart %','Sens','Matérialité','Cause'],
          e.derive.map(r=>[r.poste,$(r.budget_annuel),$(r.projete_annuel),$(r.ecart),pct(r.ecart_pct),r.sens,r.materialite,r.cause]),{num:[1,2,3,4]})}
      </details>
      <details><summary>Grille mensuelle — ${e.poste}</summary>
        ${tableau(['Mois','Statut','Budget','Projeté','Réel','Écart Réel − Budget','Écart Projeté − Budget','Cumul Réel − Budget','Alerte'],
          e.grille.map(r=>[r.mois,r.statut,$(r.budget),$(r.projete),$(r.reel),$(r.ecart_reel_budget),$(r.ecart_projete_budget),$(r.cumul_reel_budget),r.alerte]),
          {num:[2,3,4,5,6,7],defilement:true})}
      </details>`;
    const p=e.pont;
    tracer('cpa-r5-waterfall',[{type:'waterfall',
      measure:['absolute','relative','relative','relative','relative','total'],
      x:['Budget'].concat(p.slice(1,5).map(x=>x.libelle_court)).concat(['Forecast']),
      y:[p[0].cumul].concat(p.slice(1,5).map(x=>x.contribution)).concat([0]),
      textposition:'outside',
      increasing:{marker:{color:C.sarcelle}},decreasing:{marker:{color:C.rouge}},
      totals:{marker:{color:C.laiton}},connector:{line:{color:C.grille}}
    }],'Pont de trésorerie — budget vers forecast',410);
    const c=e.cumules, x=c.map(r=>r.mois);
    tracer('cpa-r5-cumul',[
      {x,y:c.map(r=>r.budget_cumule),name:'Budget cumulé',mode:'lines',type:'scatter',line:{color:C.bleu,width:2,dash:'dot'}},
      {x,y:c.map(r=>r.projete_cumule),name:'Forecast cumulé',mode:'lines+markers',type:'scatter',line:{color:C.laiton,width:2.5}},
      {x,y:c.map(r=>r.reel_cumule),name:'Réel cumulé',mode:'lines+markers',type:'scatter',connectgaps:false,line:{color:C.sarcelle,width:2.5}}
    ],'Trajectoire cumulée — budget, forecast et réel',390);
  }

  function rendreR6CPA(){
    const c=D.r6.controles;
    const classRate=c.lignes_saisies?1-(c.a_classer/c.lignes_saisies):1;
    const anomalies=Number(c.a_classer)+Number(c.doublons)+Number(c.dates_invalides)+Number(c.montants_invalides);
    document.getElementById('p-r6').innerHTML=`
      <p class="cpa-eyebrow">Treasury controls</p>
      <h2>R6 · Contrôles et qualité des données de trésorerie</h2>
      <p class="note">La priorité est la fiabilité du journal avant l'analyse : classement, doublons et validité des données.</p>
      ${bandeKpi([
        ['Taux de classement',pct(classRate),classRate>=.99?'ok':'alerte'],
        ['Transactions à classer',String(c.a_classer),c.a_classer?'alerte':'ok'],
        ['Doublons',String(c.doublons),c.doublons?'alerte':'ok'],
        ['Dates invalides',String(c.dates_invalides),c.dates_invalides?'alerte':'ok'],
        ['Montants invalides',String(c.montants_invalides),c.montants_invalides?'alerte':'ok'],
        ['Prêt à archiver',c.pret_a_archiver?'Oui':'Non',c.pret_a_archiver?'ok':'alerte']])}
      <div class="cpa-status-grid">
        ${etat(anomalies===0?'ok':anomalies<=3?'warn':'bad','Qualité du journal',`${anomalies} anomalie(s) de contrôle détectée(s).`)}
        ${etat(classRate>=.99?'ok':'warn','Classement automatique',`${pct(classRate)} des lignes sont classées.`)}
        ${etat(c.pret_a_archiver?'ok':'bad','Clôture / archivage',c.pret_a_archiver?'Les contrôles actuels permettent l’archivage.':'Corriger les anomalies avant archivage.')}
      </div>
      <details open><summary>Transactions à contrôler</summary>
        ${tableau(['Date','Description','Montant','Compte / source','Catégorie','Nature','Statut'],
          D.r6.saisie.map(r=>[r.date_brute,r.description,$(r.montant_brut,2),r.compte_source,r.categorie,r.nature,r.statut]),
          {num:[2],defilement:true})}
      </details>
      <details><summary>Table de correspondance</summary>
        ${tableau(['Ordre','Catégorie','Nature','Mots-clés'],
          D.r6.correspondance.map(r=>[r.ordre,r.categorie,r.nature,r.mots_cles]),{defilement:true})}
      </details>
      <details><summary>Journal général — extrait</summary>
        ${tableau(["N° d'écriture",'Date','Description','Montant','Catégorie','Nature'],
          D.r6.journal_extrait.map(r=>[r.no_ecriture,r.date_ecriture,r.description,$(r.montant,2),r.categorie,r.nature]),
          {num:[3],defilement:true})}
      </details>`;
  }

  function renderStaticCPA(){
    renommerOnglets();
    rendreAccueilCPA();
    rendreR0CPA();
    rendreR1CPA();
    rendreR4CPA();
    rendreR5CPA();
    rendreR6CPA();
  }

  function firstBreach(rows,seuil){
    const r=rows.find(x=>Number(x.solde)<seuil);
    return r?r.etiquette:'—';
  }
  function minSolde(rows){return Math.min(...rows.map(x=>Number(x.solde)))}
  function fundingNeed(rows,seuil){return max0(seuil-minSolde(rows))}

  rerenderDynamic = function(){
    if(document.getElementById('p-scenario')){majLabels();lireControls();}
    const r2=rollingInteractive(), r3=runBootstrap(), mc=runMC();
    window.SIMR={r2,r3,mc};

    function simulateWith(overrides){
      const backup={...SIM}; Object.assign(SIM,overrides||{});
      const res=rollingInteractive(); Object.assign(SIM,backup); return res;
    }
    const scenRows=['Pessimiste','Base','Optimiste'].map(n=>[n,simulateWith({scenario:n})]);
    const activeMin=minSolde(r2), activeNeed=fundingNeed(r2,SIM.seuil);

    // R2 — rolling forecast décisionnel
    document.getElementById('p-r2').innerHTML=`
      <p class="cpa-eyebrow">Rolling cash forecast</p>
      <h2>R2 · Rolling forecast — scénarios et sensibilité</h2>
      ${panneauR2()}
      <p class="note">Scénario actif <b>${SIM.scenario}</b> · horizon ${SIM.horizon} semaines. Le rapport met l'accent sur le point bas, la première rupture et le financement additionnel requis.</p>
      ${bandeKpi([
        ['Solde final',money(r2.at(-1).solde),r2.at(-1).solde<SIM.seuil?'alerte':'ok'],
        ['Creux projeté',money(activeMin),activeMin<SIM.seuil?'alerte':'ok'],
        ['1re semaine sous seuil',firstBreach(r2,SIM.seuil)],
        ['Semaines sous seuil',r2.filter(x=>x.solde<SIM.seuil).length+' / '+SIM.horizon],
        ['Financement additionnel max.',money(activeNeed),activeNeed>0?'alerte':'ok'],
        ['Flux net cumulé',money(r2.reduce((a,x)=>a+x.flux_net,0))]])}
      ${graphe('cpa-r2-cone')}
      <div class="duo">${graphe('cpa-r2-sens')}${graphe('cpa-r2-ref')}</div>
      <h3>Lecture des scénarios</h3>
      ${tableau(['Scénario','Solde final','Creux','1re rupture','Financement additionnel'],
        scenRows.map(([n,rows])=>[n,money(rows.at(-1).solde),money(minSolde(rows)),firstBreach(rows,SIM.seuil),money(fundingNeed(rows,SIM.seuil))]),
        {num:[1,2,4]})}
      <details><summary>Table complète du forecast</summary>
        ${tableau(['N°','Semaine','Encaissements','Charges fixes','Charges variables','Remb.','Flux net','Solde','Alerte'],
          r2.map(x=>[x.n,x.etiquette,money(x.encaissements),money(x.charges_fixes),money(x.charges_variables),money(x.remboursement),money(x.flux_net),money(x.solde),x.alerte]),
          {num:[2,3,4,5,6,7],defilement:true})}
      </details>`;
    const x=r2.map(x=>x.etiquette), pess=scenRows[0][1], opt=scenRows[2][1];
    tracer('cpa-r2-cone',[
      {x,y:opt.map(r=>r.solde),mode:'lines',type:'scatter',line:{width:0},showlegend:false,hoverinfo:'skip'},
      {x,y:pess.map(r=>r.solde),name:'Plage pessimiste – optimiste',mode:'lines',type:'scatter',fill:'tonexty',fillcolor:'rgba(177,120,45,.15)',line:{width:0}},
      {x,y:r2.map(r=>r.solde),name:`Scénario actif — ${SIM.scenario}`,mode:'lines+markers',type:'scatter',line:{color:C.laiton,width:2.6}},
      lineSeuilCPA(x,SIM.seuil)
    ],'Scénarios de trésorerie — point bas et seuil',390);
    function finalWith(overrides){return simulateWith(overrides).at(-1).solde}
    const baseFinal=r2.at(-1).solde;
    const sens=[
      ['Encaissements',finalWith({adjRev:SIM.adjRev-.03})-baseFinal,finalWith({adjRev:SIM.adjRev+.03})-baseFinal],
      ['Charges',finalWith({adjChg:SIM.adjChg+.03})-baseFinal,finalWith({adjChg:SIM.adjChg-.03})-baseFinal],
      ['Charges variables',finalWith({vars:SIM.vars*1.03})-baseFinal,finalWith({vars:SIM.vars*.97})-baseFinal],
      ['Remboursement',finalWith({paiement:SIM.paiement*1.03})-baseFinal,finalWith({paiement:SIM.paiement*.97})-baseFinal]
    ];
    tracer('cpa-r2-sens',[
      {y:sens.map(r=>r[0]),x:sens.map(r=>r[1]),name:'Choc défavorable',type:'bar',orientation:'h',marker:{color:C.rouge}},
      {y:sens.map(r=>r[0]),x:sens.map(r=>r[2]),name:'Choc favorable',type:'bar',orientation:'h',marker:{color:C.sarcelle}}
    ],'Sensibilité du solde final — choc ±3 %',360,{barmode:'relative',hovermode:'closest',margin:{l:155,r:20,t:52,b:45}});
    const rf=D.r2.referentiels.slice(0,Math.min(D.r2.referentiels.length,r2.length));
    tracer('cpa-r2-ref',[
      {x:rf.map(r=>r.etiquette),y:rf.map(r=>r.solde_reel),name:'Réel',mode:'lines+markers',type:'scatter',connectgaps:false,line:{color:C.sarcelle,width:2.3}},
      {x:rf.map(r=>r.etiquette),y:r2.slice(0,rf.length).map(r=>r.solde),name:'Forecast',mode:'lines+markers',type:'scatter',line:{color:C.laiton,width:2.3}},
      {x:rf.map(r=>r.etiquette),y:rf.map(r=>r.solde_budgete),name:'Budget',mode:'lines',type:'scatter',line:{color:C.bleu,width:2,dash:'dot'}},
      lineSeuilCPA(rf.map(r=>r.etiquette),SIM.seuil)
    ],'Réel / forecast / budget',360);

    // R3 — stress court terme
    const weeks=Array.from({length:r3.p50.length},(_,i)=>i);
    const probWeek=weeks.map((_,j)=>r3.paths.filter(p=>Number(p[j])<SIM.seuil).length/r3.paths.length);
    document.getElementById('p-r3').innerHTML=`
      <p class="cpa-eyebrow">Short-term liquidity stress</p>
      <h2>R3 · Stress court terme — bootstrap historique</h2>
      ${panneauR3()}
      <p class="note">${r3.stats.nb_essais} essais · blocs de ${SIM.blocBS} semaine(s). Le bootstrap sert à mesurer le risque court terme sans imposer une loi statistique aux flux historiques.</p>
      ${bandeKpi([
        ['Solde final médian',money(r3.stats.mediane)],
        ['P10',money(r3.stats.p10),'alerte'],
        ['Creux P5',money(r3.stats.creux_p5),r3.stats.creux_p5<SIM.seuil?'alerte':'ok'],
        ['Prob. sous le seuil',pctCPA(r3.stats.prob_sous_seuil),r3.stats.prob_sous_seuil>.05?'alerte':'ok'],
        ['Prob. découvert',pctCPA(r3.stats.prob_decouvert),r3.stats.prob_decouvert>0?'alerte':'ok'],
        ['Coussin P95 requis',money(r3.stats.coussin_requis),r3.stats.coussin_requis>0?'alerte':'ok']])}
      <div class="duo">${graphe('cpa-r3-traj')}${graphe('cpa-r3-prob')}</div>
      <div class="cpa-callout"><strong>Lecture CPA</strong><p>La probabilité par semaine indique quand le risque de rupture devient matériel; le coussin P95 sert à dimensionner la capacité de liquidité à protéger.</p></div>`;
    tracer('cpa-r3-traj',[
      {x:weeks,y:r3.p90,mode:'lines',type:'scatter',line:{width:0},showlegend:false},
      {x:weeks,y:r3.p10,name:'P10 – P90',mode:'lines',type:'scatter',fill:'tonexty',fillcolor:'rgba(177,120,45,.15)',line:{width:0}},
      {x:weeks,y:r3.p50,name:'Médiane',mode:'lines',type:'scatter',line:{color:C.laiton,width:2.6}},
      lineSeuilCPA(weeks,SIM.seuil)
    ],'Trajectoire simulée — P10 / P50 / P90',380,{xaxis:{title:'Semaine'}});
    tracer('cpa-r3-prob',[
      {x:weeks.slice(1),y:probWeek.slice(1),name:'Probabilité sous le seuil',type:'bar',
       marker:{color:probWeek.slice(1).map(p=>p>.25?C.rouge:p>.05?C.orange:C.sarcelle)}}
    ],'Probabilité de rupture — semaine par semaine',380,{hovermode:'closest',yaxis:{tickformat:'.0%',range:[0,Math.max(.1,...probWeek)*1.15]}});

    // R7 — risque 12 mois et capacité de financement
    const months=Array.from({length:mc.ptiles[3].length},(_,i)=>i);
    const probBelow=months.map((_,j)=>mc.paths.filter(p=>Number(p[j])<SIM.seuil).length/mc.paths.length);
    const probOD=months.map((_,j)=>mc.paths.filter(p=>Number(p[j])<0).length/mc.paths.length);
    const available=D.kpi.marge_disponible, coverage=available-mc.stats.coussin_requis;
    const firsts=mc.paths.map(p=>p.findIndex((v,j)=>j>0&&Number(v)<SIM.seuil)).filter(i=>i>0);
    const medFirst=firsts.length?Math.round(percent(firsts,50)):'—';
    document.getElementById('p-r7').innerHTML=`
      <p class="cpa-eyebrow">Liquidity risk & funding capacity</p>
      <h2>R7 · Risque de liquidité et capacité de financement</h2>
      ${panneauR7()}
      <p class="note">Monte-Carlo sur 12 mois pour le risque de liquidité à moyen terme. Le bootstrap court terme demeure dans R3 et n'est pas soustrait directement du Monte-Carlo puisqu'il couvre un horizon différent.</p>
      ${bandeKpi([
        ['Solde final médian',money(mc.stats.mediane)],
        ['P10',money(mc.stats.p10),'alerte'],
        ['Creux P5',money(mc.stats.creux_p5),mc.stats.creux_p5<SIM.seuil?'alerte':'ok'],
        ['Prob. sous le seuil',pctCPA(mc.stats.prob_sous_seuil),mc.stats.prob_sous_seuil>.05?'alerte':'ok'],
        ['Coussin P95 requis',money(mc.stats.coussin_requis),mc.stats.coussin_requis>0?'alerte':'ok'],
        ['Couverture de marge',money(coverage),coverage>=0?'ok':'alerte']])}
      ${graphe('cpa-r7-fan')}
      <div class="duo">${graphe('cpa-r7-prob')}${graphe('cpa-r7-funding')}</div>
      <h3>Lecture de contrôle</h3>
      ${tableau(['Indicateur','Lecture'],[
        ['Horizon de risque','12 mois — Monte-Carlo paramétrique'],
        ['Marge de crédit disponible',money(available)],
        ['Coussin requis P95',money(mc.stats.coussin_requis)],
        ['Headroom après stress',money(coverage)],
        ['Mois médian de première rupture — essais touchés',medFirst==='—'?'Aucune rupture':`Mois ${medFirst}`],
        ['R3 — stress court terme',`${r3.stats.nb_essais} essais bootstrap · prob. sous seuil ${pctCPA(r3.stats.prob_sous_seuil)} · coussin ${money(r3.stats.coussin_requis)}`]
      ])}`;
    tracer('cpa-r7-fan',[
      {x:months,y:mc.ptiles[6],mode:'lines',type:'scatter',line:{width:0},showlegend:false,hoverinfo:'skip'},
      {x:months,y:mc.ptiles[0],name:'P5 – P95',mode:'lines',type:'scatter',fill:'tonexty',fillcolor:'rgba(177,120,45,.10)',line:{width:0}},
      {x:months,y:mc.ptiles[4],mode:'lines',type:'scatter',line:{width:0},showlegend:false,hoverinfo:'skip'},
      {x:months,y:mc.ptiles[2],name:'P25 – P75',mode:'lines',type:'scatter',fill:'tonexty',fillcolor:'rgba(177,120,45,.22)',line:{width:0}},
      {x:months,y:mc.ptiles[3],name:'Médiane',mode:'lines',type:'scatter',line:{color:C.laiton,width:2.7}},
      lineSeuilCPA(months,SIM.seuil)
    ],'Éventail du solde de trésorerie — 12 mois',410,{xaxis:{title:'Mois'}});
    tracer('cpa-r7-prob',[
      {x:months.slice(1),y:probBelow.slice(1),name:'Sous le seuil',mode:'lines+markers',type:'scatter',line:{color:C.orange,width:2.3}},
      {x:months.slice(1),y:probOD.slice(1),name:'Découvert',mode:'lines+markers',type:'scatter',line:{color:C.rouge,width:2.3}}
    ],'Probabilité de tension dans le temps',360,{yaxis:{tickformat:'.0%',range:[0,Math.max(.1,...probBelow)*1.15]}});
    tracer('cpa-r7-funding',[
      {y:['Marge disponible','Coussin P95'],x:[available,mc.stats.coussin_requis],type:'bar',orientation:'h',
       marker:{color:[C.sarcelle,mc.stats.coussin_requis>available?C.rouge:C.laiton]}}
    ],'Capacité de financement vs coussin requis',360,{hovermode:'closest',margin:{l:130,r:25,t:52,b:45}});

    // Synchronise R1 avec le scénario actif sans refaire les données de base.
    document.querySelectorAll('#sim-r1-badge').forEach(x=>x.remove());
    const r1=document.getElementById('p-r1');
    if(r1){
      r1.querySelector('.note')?.insertAdjacentHTML('afterend',
        `<div id="sim-r1-badge" class="cpa-callout"><strong>Scénario R2 actif</strong><p>${SIM.scenario} · solde final ${money(r2.at(-1).solde)} · creux ${money(activeMin)} · financement additionnel max. ${money(activeNeed)}.</p></div>`);
      const el=document.getElementById('cpa-r1-cycle');
      if(el&&el.data&&el.data.length){
        const idx=el.data.length-1;
        Plotly.restyle('cpa-r1-cycle',{y:[el.data[idx].x.map(()=>SIM.seuil)]},[idx]).catch(()=>{});
      }
    }
    initControls(); wireControls();
    const state=document.getElementById('sim-state');
    if(state) state.textContent=`Mis à jour ${new Date().toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'})}`;
  };

  renderStaticCPA();
  rerenderDynamic();
})();
</script>


<style id="cpa-v2-style">
  .sens-checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:7px;margin-top:8px}
  .sens-check{display:flex!important;align-items:center;gap:7px;background:var(--fond);border:1px solid var(--grille);padding:7px 9px;border-radius:5px;color:var(--texte)!important;font-size:.76rem!important;margin:0!important}
  .sens-check input{width:auto!important;margin:0}
  .control-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:14px 0}
  .control-card{background:var(--surface);border:1px solid var(--grille);border-radius:7px;padding:12px 14px}
  .control-card .ctl-name{font-size:.74rem;color:var(--attenue);margin-bottom:5px}
  .control-card .ctl-value{font-family:'IBM Plex Mono',monospace;font-size:1.05rem;font-weight:600}
  .control-card .ctl-status{font-size:.72rem;margin-top:5px}
  .ctl-ok{color:var(--vert)} .ctl-warn{color:var(--orange)} .ctl-bad{color:var(--rouge)}
  .recon-strip{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:center;margin:15px 0;background:var(--surface2);border:1px solid var(--grille);border-radius:7px;padding:12px}
  .recon-strip .box{text-align:center}.recon-strip .box small{display:block;color:var(--attenue);font-size:.7rem}.recon-strip .box strong{font-family:'IBM Plex Mono',monospace;font-size:1rem}
  .recon-strip .arrow{color:var(--laiton);font-weight:700}
  @media(max-width:700px){.recon-strip{grid-template-columns:1fr}.recon-strip .arrow{transform:rotate(90deg);text-align:center}}
</style>
<script id="cpa-v2-script">
(function(){
  // -------------------- Nouveaux paramètres --------------------
  if(SIM.sensPct===undefined) SIM.sensPct=5;
  if(!Array.isArray(SIM.sensLevers)) SIM.sensLevers=['encaissements','fixes','variables','remboursement','bloc'];
  if(SIM.nPaths===undefined) SIM.nPaths=12;

  const v2money=n=>money(Number(n)||0);
  const v2pct=n=>pct(Number(n)||0);
  const avg=a=>a.length?a.reduce((s,x)=>s+Number(x||0),0)/a.length:0;
  const std=a=>{if(a.length<2)return 0;const m=avg(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1));};
  const minRowV2=rows=>rows.reduce((a,b)=>Number(b.solde)<Number(a.solde)?b:a,rows[0]);
  const vline=(x,color=C.rouge,dash='dash')=>({type:'line',xref:'x',yref:'paper',x0:x,x1:x,y0:0,y1:1,line:{color,width:1.5,dash}});

  // -------------------- Panneaux de paramètres --------------------
  panneauR2 = function(){
    const opts=[['encaissements','Encaissements / cycle'],['fixes','Charges fixes'],['variables','Charges variables'],['remboursement','Remboursement financement'],['bloc','Bloc mensuel de charges']];
    return `<div class="sim-panel" id="simulateur-r2">
      <div class="sim-head"><div><div class="sim-title">Paramètres · R2 Rolling forecast</div><div class="note" style="margin:2px 0 0">Hypothèses du forecast et analyse de sensibilité paramétrable.</div></div></div>
      <div class="sim-grid">
        <div class="sim-group"><h4>Liquidité et scénario</h4>
          <label>Solde de départ ($)</label><input id="p-solde" type="number" step="5000">
          <label>Seuil de sécurité ($) <span id="v-seuil" class="range-val"></span></label><input id="p-seuil" type="range" min="0" max="1000000" step="10000">
          <label>Scénario</label><select id="p-scenario"><option>Pessimiste</option><option>Base</option><option>Optimiste</option></select>
          <label>Horizon (semaines) <span id="v-horizon" class="range-val"></span></label><input id="p-horizon" type="range" min="4" max="52" step="1">
        </div>
        <div class="sim-group"><h4>Encaissements</h4>
          <label>Ajustement encaissements <span id="v-rev" class="range-val"></span></label><input id="p-rev" type="range" min="-30" max="30" step="1">
          <label>Ajustement charges <span id="v-chg" class="range-val"></span></label><input id="p-chg" type="range" min="-30" max="30" step="1">
          <label>Encaissement par cycle ($)</label><input id="p-cycle-encaissement" type="number" step="10000">
          <label>Fréquence d'encaissement</label><select id="p-freq"><option value="1">Chaque semaine</option><option value="2">Aux 2 semaines</option><option value="3">Aux 3 semaines</option><option value="4">Aux 4 semaines</option></select>
        </div>
        <div class="sim-group"><h4>Charges et financement</h4>
          <label>Remboursement hebdomadaire ($)</label><input id="p-paiement" type="number" step="5000">
          <label>Charges fixes / semaine ($)</label><input id="p-fixes" type="number" step="5000">
          <label>Charges variables / semaine ($)</label><input id="p-vars" type="number" step="5000">
          <label>Bloc de charges mensuel ($)</label><input id="p-bloc" type="number" step="10000">
        </div>
        <div class="sim-group"><h4>Sensibilité des leviers</h4>
          <label>Niveau du choc ± <span id="v-sens-pct" class="range-val"></span></label><input id="p-sens-pct" type="range" min="1" max="30" step="1">
          <label>Leviers à tester</label>
          <div class="sens-checks">${opts.map(([id,lab])=>`<label class="sens-check"><input class="sens-lever" data-lever="${id}" type="checkbox" id="sens-${id}"> ${lab}</label>`).join('')}</div>
          <div class="sim-help" style="margin-top:8px">Chaque levier est choqué isolément autour des hypothèses actives.</div>
        </div>
      </div>
      <div class="sim-actions"><button id="btn-reset">Réinitialiser R2</button><span class="sim-help">Recalcul immédiat du rapport.</span></div>
    </div>`;
  };

  panneauR7 = function(){
    return `<div class="sim-panel" id="simulateur-r7"><div class="sim-head"><div><div class="sim-title">Paramètres · R7 Monte-Carlo</div><div class="note" style="margin:2px 0 0">Hypothèses probabilistes et nombre de trajectoires visibles.</div></div><div id="sim-state" class="sim-state">Prêt</div></div>
      <div class="sim-grid">
        <div class="sim-group"><h4>Hypothèses Monte-Carlo</h4>
          <label>Croissance mensuelle <span id="v-growth" class="range-val"></span></label><input id="p-growth" type="range" min="-2" max="3" step="0.1">
          <label>DSO moyen (jours) <span id="v-dso" class="range-val"></span></label><input id="p-dso" type="range" min="15" max="90" step="1">
          <label>Prob. rupture contrat <span id="v-rupture" class="range-val"></span></label><input id="p-rupture" type="range" min="0" max="20" step="1">
          <label>Effet rupture (%) <span id="v-effet" class="range-val"></span></label><input id="p-effet" type="range" min="-80" max="0" step="1">
        </div>
        <div class="sim-group"><h4>Simulation et affichage</h4>
          <label>Essais Monte-Carlo <span id="v-nmc" class="range-val"></span></label><input id="p-nmc" type="range" min="100" max="1500" step="100">
          <label>Scénarios affichés (spaghetti) <span id="v-npaths" class="range-val"></span></label><input id="p-npaths" type="range" min="5" max="50" step="1">
          <div class="sim-help" style="margin-top:10px">Le nombre d'essais pilote le calcul; le nombre de scénarios affichés ne change que la lecture du spaghetti chart.</div>
        </div>
      </div>
      <div class="sim-actions"><button id="btn-simulation" class="secondary">Relancer les tirages</button><span class="sim-help">Le bootstrap se règle dans R3.</span></div></div>`;
  };

  // -------------------- Contrôles : lecture / affichage --------------------
  initControls = function(){
    const set=(id,v)=>{const e=document.getElementById(id);if(e)e.value=v;};
    set('p-solde',SIM.solde_depart);set('p-seuil',SIM.seuil);set('p-scenario',SIM.scenario);set('p-horizon',SIM.horizon);
    set('p-rev',SIM.adjRev*100);set('p-chg',SIM.adjChg*100);set('p-cycle-encaissement',SIM.cycleEncaissement);set('p-freq',SIM.frequence);
    set('p-paiement',SIM.paiement);set('p-fixes',SIM.fixes);set('p-vars',SIM.vars);set('p-bloc',SIM.bloc);
    set('p-growth',SIM.growth*100);set('p-dso',SIM.dso);set('p-rupture',SIM.probRupture*100);set('p-effet',SIM.effetRupture*100);set('p-nmc',SIM.nMC);
    set('p-nbs',SIM.nBS);set('p-bbs',SIM.blocBS);set('p-sens-pct',SIM.sensPct);set('p-npaths',SIM.nPaths);
    document.querySelectorAll('.sens-lever').forEach(e=>e.checked=SIM.sensLevers.includes(e.dataset.lever));
    majLabels();
  };
  majLabels = function(){
    const txt=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
    const val=id=>document.getElementById(id)?.value;
    txt('v-seuil',v2money(Number(val('p-seuil')||SIM.seuil)));txt('v-horizon',(val('p-horizon')||SIM.horizon)+' sem.');
    txt('v-rev',Number(val('p-rev')||0).toLocaleString('fr-CA')+' %');txt('v-chg',Number(val('p-chg')||0).toLocaleString('fr-CA')+' %');
    txt('v-growth',Number(val('p-growth')||SIM.growth*100).toLocaleString('fr-CA',{maximumFractionDigits:1})+' %');txt('v-dso',(val('p-dso')||SIM.dso)+' j');
    txt('v-rupture',(val('p-rupture')||SIM.probRupture*100)+' %');txt('v-effet',(val('p-effet')||SIM.effetRupture*100)+' %');
    txt('v-nmc',val('p-nmc')||SIM.nMC);txt('v-nbs',val('p-nbs')||SIM.nBS);txt('v-bbs',(val('p-bbs')||SIM.blocBS)+' sem.');
    txt('v-sens-pct',(val('p-sens-pct')||SIM.sensPct)+' %');txt('v-npaths',val('p-npaths')||SIM.nPaths);
  };
  lireControls = function(){
    const num=(id,fallback)=>{const e=document.getElementById(id);return e?Number(e.value):fallback};
    const str=(id,fallback)=>document.getElementById(id)?.value??fallback;
    SIM.solde_depart=num('p-solde',SIM.solde_depart);SIM.seuil=num('p-seuil',SIM.seuil);SIM.scenario=str('p-scenario',SIM.scenario);SIM.horizon=num('p-horizon',SIM.horizon);
    SIM.adjRev=num('p-rev',SIM.adjRev*100)/100;SIM.adjChg=num('p-chg',SIM.adjChg*100)/100;SIM.cycleEncaissement=num('p-cycle-encaissement',SIM.cycleEncaissement);SIM.frequence=num('p-freq',SIM.frequence);
    SIM.paiement=num('p-paiement',SIM.paiement);SIM.fixes=num('p-fixes',SIM.fixes);SIM.vars=num('p-vars',SIM.vars);SIM.bloc=num('p-bloc',SIM.bloc);
    SIM.growth=num('p-growth',SIM.growth*100)/100;SIM.dso=num('p-dso',SIM.dso);SIM.probRupture=num('p-rupture',SIM.probRupture*100)/100;SIM.effetRupture=num('p-effet',SIM.effetRupture*100)/100;
    SIM.nMC=num('p-nmc',SIM.nMC);SIM.nBS=num('p-nbs',SIM.nBS);SIM.blocBS=num('p-bbs',SIM.blocBS);SIM.sensPct=num('p-sens-pct',SIM.sensPct);SIM.nPaths=num('p-npaths',SIM.nPaths);
    const checked=[...document.querySelectorAll('.sens-lever:checked')].map(e=>e.dataset.lever);if(document.querySelectorAll('.sens-lever').length)SIM.sensLevers=checked;
  };
  wireControls = function(){
    document.querySelectorAll('.sim-panel input,.sim-panel select').forEach(el=>{el.addEventListener('input',()=>{majLabels();schedule()});el.addEventListener('change',()=>{majLabels();schedule()})});
    document.getElementById('btn-reset')?.addEventListener('click',()=>{Object.assign(SIM,{scenario:'Base',solde_depart:BASE_PARAMS.forecast.solde_depart,seuil:BASE_PARAMS.general.seuil_securite,horizon:BASE_PARAMS.forecast.horizon_semaines,adjRev:0,adjChg:0,cycleEncaissement:BASE_PARAMS.forecast.encaissement_par_cycle,frequence:BASE_PARAMS.forecast.frequence_encaissement,paiement:BASE_PARAMS.forecast.paiement_hebdo_financement,fixes:BASE_PARAMS.forecast.charges_recurrentes_hebdo,vars:BASE_PARAMS.forecast.charges_variables_hebdo,bloc:BASE_PARAMS.forecast.bloc_charges_fixes_mensuel,sensPct:5,sensLevers:['encaissements','fixes','variables','remboursement','bloc']});initControls();schedule()});
    document.getElementById('btn-simulation')?.addEventListener('click',()=>{lireControls();SIM.graine=Math.floor(Math.random()*1000000000);schedule()});
  };

  // -------------------- R1 : remplacement du headroom --------------------
  function renderR1V2(){
    const s=D.r1.semaines,i=D.r1.indicateurs,f=D.r1.facilites,min=minRowV2(s),am=D.r1.amortissement;
    const marge=f.find(x=>String(x.facilite).includes('Marge'))||f[0];
    const totalPaiements=am.slice(1).reduce((a,x)=>a+Number(x.paiement||0),0);
    document.getElementById('p-r1').innerHTML=`
      <p class="cpa-eyebrow">13-week cash position</p><h2>R1 · Liquidité immédiate — 13 semaines</h2>
      <p class="note">Suivi opérationnel du cycle de cash et du financement revolving : point bas, semaines de tension et profil de remboursement.</p>
      ${bandeKpi([
        ['Solde actuel',v2money(i.solde_actuel)],['Creux du cycle',v2money(i.creux),i.creux<i.seuil?'alerte':'ok'],['Semaine du creux',min.libelle],
        ['Semaines sous seuil',i.semaines_sous_seuil+' / '+i.nb_semaines,i.semaines_sous_seuil?'alerte':'ok'],['Utilisation marge',v2pct(marge.utilisation)],['Paiements planifiés',v2money(totalPaiements)]])}
      ${graphe('v2-r1-cycle')}
      <div class="duo">${graphe('v2-r1-revolving')}${graphe('v2-r1-facilites')}</div>
      <div class="cpa-callout"><strong>Lecture de contrôle</strong><p>Le second graphique suit directement l'endettement revolving restant et les remboursements planifiés. Il permet de voir si la réduction de dette est cohérente avec la trajectoire de cash, sans introduire un indicateur de headroom.</p></div>
      <details><summary>Plan de remboursement du financement revolving</summary>${tableau(['Semaine','Dette revolving restante','Paiement','Intérêts'],am.map(r=>[r.semaine,v2money(r.total),v2money(r.paiement),v2money(r.interets)]),{num:[1,2,3],defilement:true})}</details>
      <details><summary>Détail hebdomadaire</summary>${tableau(['Semaine','Statut','Entrées','Sorties','Net','Solde','Note'],s.map(x=>[x.libelle,x.statut,v2money(x.entrees),v2money(x.sorties),v2money(x.net),v2money(x.solde),x.note||'']),{num:[2,3,4,5],defilement:true})}</details>`;
    const lib=s.map(x=>x.libelle);
    tracer('v2-r1-cycle',[
      {x:lib,y:s.map(x=>x.entrees),name:'Encaissements',type:'bar',marker:{color:C.sarcelle}},
      {x:lib,y:s.map(x=>-x.sorties),name:'Décaissements',type:'bar',marker:{color:C.rouge}},
      {x:lib,y:s.map(x=>x.solde),name:'Solde',mode:'lines+markers',type:'scatter',yaxis:'y2',line:{color:C.laiton,width:2.7}},
      {x:lib,y:lib.map(()=>SIM.seuil),name:'Seuil',mode:'lines',type:'scatter',yaxis:'y2',line:{color:C.rouge,dash:'dash'}}
    ],'Cycle de trésorerie — réel + projection',430,{barmode:'relative',yaxis2:{overlaying:'y',side:'right',showgrid:false}});
    const ax=am.map(r=>r.semaine);let cum=0;const cpays=am.map(r=>{cum+=Number(r.paiement||0);return cum});
    tracer('v2-r1-revolving',[
      {x:ax,y:am.map(r=>r.total),name:'Dette restante',mode:'lines+markers',type:'scatter',line:{color:C.laiton,width:2.6}},
      {x:ax,y:cpays,name:'Paiements cumulés',type:'bar',yaxis:'y2',marker:{color:C.sarcelle},opacity:.55}
    ],'Financement revolving — solde restant et remboursements',370,{yaxis2:{overlaying:'y',side:'right',showgrid:false,title:'Paiements cumulés'},hovermode:'x unified'});
    tracer('v2-r1-facilites',[
      {x:f.map(x=>x.facilite),y:f.map(x=>x.solde),name:'Utilisé',type:'bar',marker:{color:C.rouge}},
      {x:f.map(x=>x.facilite),y:f.map(x=>x.disponible),name:'Disponible',type:'bar',marker:{color:C.sarcelle}}
    ],'Facilités — utilisé vs disponible',370,{barmode:'stack',hovermode:'closest'});
  }

  // -------------------- R5 : remplacement du waterfall --------------------
  function renderR5V2(){
    const e=D.r5,p=e.pont,contrib=p.slice(1,5).map(x=>({...x})).sort((a,b)=>Math.abs(b.contribution)-Math.abs(a.contribution));
    const budget=Number(p[0].cumul),forecast=Number(p[p.length-1].cumul),variance=forecast-budget;
    const principal=contrib[0];
    document.getElementById('p-r5').innerHTML=`
      <p class="cpa-eyebrow">Cash variance analysis</p><h2>R5 · Écarts de trésorerie — budget, forecast et réel</h2>
      <p class="note">Lecture centrée sur l'atterrissage annuel et les postes qui expliquent la dérive de cash.</p>
      ${bandeKpi([['Flux net budgété',v2money(budget)],['Forecast actuel',v2money(forecast),variance<0?'alerte':'ok'],['Écart total',v2money(variance),variance<0?'alerte':'ok'],['Principal facteur',principal.libelle_court],['Impact principal',v2money(principal.contribution),principal.contribution<0?'alerte':'ok']])}
      <div class="recon-strip"><div class="box"><small>Budget annuel</small><strong>${v2money(budget)}</strong></div><div class="arrow">→</div><div class="box"><small>Écart total</small><strong class="${variance<0?'defavorable':'favorable'}">${v2money(variance)}</strong></div><div class="arrow">→</div><div class="box"><small>Forecast annuel</small><strong>${v2money(forecast)}</strong></div></div>
      ${graphe('v2-r5-contrib')}${graphe('v2-r5-cumul')}
      <details open><summary>Réconciliation numérique des contributions</summary>${tableau(['Poste','Contribution','Effet','Cumul après contribution'],p.slice(1,5).map(r=>[r.libelle_court,v2money(r.contribution),r.effet,v2money(r.cumul)]),{num:[1,3]})}</details>
      <details><summary>Détail mensuel — poste sélectionné</summary>${tableau(['Mois','Statut','Budget','Projeté','Réel','Écart Réel − Budget','Écart Projeté − Budget','Cumul Réel − Budget','Alerte'],e.grille.map(r=>[r.mois,r.statut,v2money(r.budget),v2money(r.projete),v2money(r.reel),v2money(r.ecart_reel_budget),v2money(r.ecart_projete_budget),v2money(r.cumul_reel_budget),r.alerte]),{num:[2,3,4,5,6,7],defilement:true})}</details>`;
    tracer('v2-r5-contrib',[{y:contrib.map(x=>x.libelle_court),x:contrib.map(x=>x.contribution),type:'bar',orientation:'h',
      marker:{color:contrib.map(x=>x.contribution<0?C.rouge:C.sarcelle)},text:contrib.map(x=>v2money(x.contribution)),textposition:'auto',cliponaxis:false}],
      'Contribution de chaque poste à l’écart annuel de trésorerie',400,{hovermode:'closest',margin:{l:185,r:70,t:55,b:45},xaxis:{zeroline:true,zerolinecolor:C.texte,zerolinewidth:1,showgrid:true,gridcolor:C.grille}});
    const c=e.cumules,x=c.map(r=>r.mois);
    tracer('v2-r5-cumul',[
      {x,y:c.map(r=>r.budget_cumule),name:'Budget cumulé',mode:'lines',type:'scatter',line:{color:C.bleu,width:2,dash:'dot'}},
      {x,y:c.map(r=>r.projete_cumule),name:'Forecast cumulé',mode:'lines+markers',type:'scatter',line:{color:C.laiton,width:2.5}},
      {x,y:c.map(r=>r.reel_cumule),name:'Réel cumulé',mode:'lines+markers',type:'scatter',connectgaps:false,line:{color:C.sarcelle,width:2.5}}
    ],'Trajectoire cumulée — budget, forecast et réel',390);
  }

  // -------------------- R6 : contrôles enrichis --------------------
  function renderR6V2(){
    const c=D.r6.controles,rows=D.r6.saisie,total=rows.length||1;
    const unclassified=rows.filter(r=>String(r.statut).includes('classer'));
    const totalAbs=rows.reduce((s,r)=>s+Math.abs(Number(r.montant_brut)||0),0)||1;
    const unclAbs=unclassified.reduce((s,r)=>s+Math.abs(Number(r.montant_brut)||0),0);
    const validRate=Number(c.lignes_valides)/Number(c.lignes_saisies||1),classRate=1-Number(c.a_classer)/Number(c.lignes_saisies||1),weightedRate=1-unclAbs/totalAbs;
    const missingDesc=rows.filter(r=>!String(r.description||'').trim()).length,missingSrc=rows.filter(r=>!String(r.compte_source||'').trim()).length,zeroAmt=rows.filter(r=>Math.abs(Number(r.montant_brut)||0)<.005).length;
    const signMismatch=rows.filter(r=>{const n=r.nature,m=Number(r.montant_brut)||0;if(n==='À classer')return false;if(n==='Revenu')return m<0;return ['Fixe','Variable','Financement'].includes(n)&&m>0;}).length;
    const recon=Math.abs(Number(c.total_entrees)+Number(c.total_sorties)-Number(c.flux_net));
    const largestUncl=unclassified.length?Math.max(...unclassified.map(r=>Math.abs(Number(r.montant_brut)||0))):0;
    const ctl=[
      ['Lignes valides',v2pct(validRate),validRate===1,'100 % attendu'],['Classement — nombre',v2pct(classRate),classRate>=.99,'≥ 99 %'],['Classement — valeur $',v2pct(weightedRate),weightedRate>=.99,'≥ 99 %'],
      ['Transactions à classer',String(c.a_classer),Number(c.a_classer)===0,'0 attendu'],['Montant non classé',v2money(unclAbs),unclAbs===0,'0 $ attendu'],['Plus grande ligne non classée',v2money(largestUncl),largestUncl===0,'0 $ attendu'],
      ['Doublons',String(c.doublons),Number(c.doublons)===0,'0 attendu'],['Dates invalides',String(c.dates_invalides),Number(c.dates_invalides)===0,'0 attendu'],['Montants invalides',String(c.montants_invalides),Number(c.montants_invalides)===0,'0 attendu'],
      ['Descriptions manquantes',String(missingDesc),missingDesc===0,'0 attendu'],['Comptes / sources manquants',String(missingSrc),missingSrc===0,'0 attendu'],['Montants nuls',String(zeroAmt),zeroAmt===0,'0 attendu'],
      ['Incohérences signe / nature',String(signMismatch),signMismatch===0,'0 attendu'],['Écart de réconciliation',v2money(recon),recon<.01,'0 $ attendu'],['Prêt à archiver',c.pret_a_archiver?'Oui':'Non',Boolean(c.pret_a_archiver),'Tous contrôles conformes']
    ];
    const exceptions=ctl.filter(x=>!x[2]).length;
    document.getElementById('p-r6').innerHTML=`
      <p class="cpa-eyebrow">Treasury controls</p><h2>R6 · Contrôles et qualité des données de trésorerie</h2>

  // -------------------- R2 / R3 / R7 dynamiques --------------------
  rerenderDynamic = function(){

    const activeMin=Math.min(...r2.map(x=>x.solde));

    // R2
    document.getElementById('p-r2').innerHTML=`<p class="cpa-eyebrow">Rolling cash forecast</p><h2>R2 · Rolling forecast — scénarios et sensibilité</h2>${panneauR2()}
      <p class="note">Scénario actif <b>${SIM.scenario}</b> · horizon ${SIM.horizon} semaines. La sensibilité applique un choc de ±${SIM.sensPct}% aux leviers opérationnels sélectionnés, un levier à la fois.</p>
      ${bandeKpi([['Solde final',v2money(r2.at(-1).solde),r2.at(-1).solde<SIM.seuil?'alerte':'ok'],['Creux projeté',v2money(activeMin),activeMin<SIM.seuil?'alerte':'ok'],['1re semaine sous seuil',firstBreach(r2,SIM.seuil)],['Semaines sous seuil',r2.filter(x=>x.solde<SIM.seuil).length+' / '+SIM.horizon],['Financement additionnel max.',v2money(need(r2,SIM.seuil)),need(r2,SIM.seuil)>0?'alerte':'ok'],['Flux net cumulé',v2money(r2.reduce((a,x)=>a+x.flux_net,0))]])}

      <details><summary>Table complète du forecast</summary>${tableau(['N°','Semaine','Encaissements','Charges fixes','Charges variables','Remb.','Flux net','Solde','Alerte'],r2.map(x=>[x.n,x.etiquette,v2money(x.encaissements),v2money(x.charges_fixes),v2money(x.charges_variables),v2money(x.remboursement),v2money(x.flux_net),v2money(x.solde),x.alerte]),{num:[2,3,4,5,6,7],defilement:true})}</details>`;
    const x=r2.map(x=>x.etiquette),pess=scenRows[0][1],opt=scenRows[2][1];
    tracer('v2-r2-cone',[{x,y:opt.map(r=>r.solde),mode:'lines',type:'scatter',line:{width:0},showlegend:false,hoverinfo:'skip'},{x,y:pess.map(r=>r.solde),name:'Plage pessimiste – optimiste',mode:'lines',type:'scatter',fill:'tonexty',fillcolor:'rgba(177,120,45,.15)',line:{width:0}},{x,y:r2.map(r=>r.solde),name:`Scénario actif — ${SIM.scenario}`,mode:'lines+markers',type:'scatter',line:{color:C.laiton,width:2.6}},{x,y:x.map(()=>SIM.seuil),name:'Seuil',mode:'lines',type:'scatter',line:{color:C.rouge,dash:'dash'}}],'Scénarios de trésorerie — point bas et seuil',390);
    const p=SIM.sensPct/100,baseFinal=r2.at(-1).solde;
    const definitions={
      encaissements:['Encaissements / cycle',{cycleEncaissement:SIM.cycleEncaissement*(1-p)},{cycleEncaissement:SIM.cycleEncaissement*(1+p)}],
      fixes:['Charges fixes',{fixes:SIM.fixes*(1+p)},{fixes:SIM.fixes*(1-p)}],
      variables:['Charges variables',{vars:SIM.vars*(1+p)},{vars:SIM.vars*(1-p)}],
      remboursement:['Remboursement financement',{paiement:SIM.paiement*(1+p)},{paiement:SIM.paiement*(1-p)}],
